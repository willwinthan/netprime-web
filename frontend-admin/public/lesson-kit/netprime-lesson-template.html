<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชื่อบทเรียน | NetPrime Self-learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ไฟล์ต้นแบบบทเรียน NetPrime Self-learning (Lesson Kit v1)
  คู่มือ: docs/SELF-LEARNING-LESSON-KIT.md ใน repo

  วิธีใช้
  1. แก้เนื้อหาใน STEPS และ QUIZ ด้านล่าง หรือเขียนหน้าใหม่ทั้งหมดก็ได้ แต่ต้องเก็บบล็อก "NetPrime Lesson Kit" ไว้
  2. ใช้สีผ่านตัวแปร --np-* เท่านั้น (เช่น var(--np-primary)) ไม่ต้องใส่สีเอง เว็บจะส่งธีมจริงมาให้ตอนเปิดบนเว็บ
  3. ทุกอย่างต้องอยู่ในไฟล์นี้ไฟล์เดียว (CSS, JavaScript, รูปแบบ data: หรือ SVG) ไม่เกิน 15 MB
  4. เปิดไฟล์นี้ในเบราว์เซอร์ตรง ๆ เพื่อลองได้ แล้วอัปโหลดในหลังบ้าน เมนู "บทเรียน Self-learning"
-->
<style>
  /* ค่าเริ่มต้นตามธีม NetPrime เว็บจะส่งค่าจริงมาแทนเมื่อเปิดบนเว็บ */
  :root {
    --np-primary: #c2541a;
    --np-primary-dark: #973f13;
    --np-primary-tint: #f9eee8;
    --np-accent: #d48760;
    --np-secondary: #182443;
    --np-radius: 14px;
    --np-font: 'Anuphan', system-ui, sans-serif;
    --ink: var(--np-secondary);
    --muted: #5a6478;
    --line: #e6e1dc;
    --bg: #fdfcfb;
    --surface: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--np-font); font-size: 16px; line-height: 1.7; }
  .lesson { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; display: grid; gap: 20px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .kicker { margin: 0; color: var(--np-primary); font-weight: 600; font-size: 14px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.35; }
  h2 { margin: 0 0 8px; font-size: 21px; }
  .meter { display: grid; gap: 4px; min-width: 180px; font-size: 14px; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--np-primary); transition: width .3s ease; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; padding: 0; margin: 0; list-style: none; }
  .steps button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .steps button[aria-current="step"] { border-color: var(--np-primary); background: var(--np-primary-tint); color: var(--np-primary-dark); font-weight: 600; }
  .steps button.seen::after { content: " ✓"; color: var(--np-primary); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--np-radius); padding: 20px; }
  .nav { display: flex; justify-content: space-between; gap: 8px; }
  .btn { font: inherit; font-weight: 600; border-radius: calc(var(--np-radius) - 4px); padding: 10px 18px; cursor: pointer; border: 1px solid var(--np-primary); }
  .btn-primary { background: var(--np-primary); color: #fff; }
  .btn-primary:hover { background: var(--np-primary-dark); }
  .btn-ghost { background: transparent; color: var(--np-primary); }
  .btn:disabled { opacity: .45; cursor: default; }
  .quiz { display: grid; gap: 8px; }
  .quiz button { text-align: left; font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .quiz button.right { border-color: #1f6b45; background: #e3f4ea; }
  .quiz button.wrong { border-color: #b42318; background: #fdecea; }
  .done { color: #1f6b45; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--np-primary); outline-offset: 2px; }
  @media (max-width: 600px) { h1 { font-size: 23px; } .card { padding: 16px; } }
</style>
</head>
<body>
<main class="lesson">
  <header class="top">
    <div>
      <p class="kicker">NetPrime Self-learning</p>
      <h1>ชื่อบทเรียน</h1>
    </div>
    <div class="meter" aria-live="polite">
      <span id="progressText">เรียนไปแล้ว 0%</span>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
  </header>
  <ol class="steps" id="stepList" aria-label="ขั้นตอนในบทเรียน"></ol>
  <section class="card" id="stepCard" aria-live="polite"></section>
  <div class="nav">
    <button type="button" class="btn btn-ghost" id="prevBtn">ก่อนหน้า</button>
    <button type="button" class="btn btn-primary" id="nextBtn">ถัดไป</button>
  </div>
</main>

<!-- ========== NetPrime Lesson Kit v1: ห้ามแก้บล็อกนี้ ========== -->
<script>
(function () {
  var P = 'netprime-lesson:';
  var embedded = window.parent !== window;
  var themeHandlers = [], restoreHandlers = [], lastRestore = null, timer = 0;
  function send(type, data) {
    if (!embedded) return;
    var message = data || {};
    message.type = P + type;
    try { window.parent.postMessage(message, '*'); } catch (e) { /* ไม่มีหน้าแม่ */ }
  }
  function applyTheme(theme) {
    if (!theme || !theme.vars) return;
    var root = document.documentElement;
    for (var name in theme.vars) {
      if (/^--np-[a-z-]+$/.test(name) && typeof theme.vars[name] === 'string') root.style.setProperty(name, theme.vars[name]);
    }
    if (typeof theme.fontHref === 'string' && /^https:\/\/fonts\.googleapis\.com\//.test(theme.fontHref) && !document.querySelector('link[data-np-font]')) {
      var link = document.createElement('link');
      link.rel = 'stylesheet'; link.href = theme.fontHref; link.setAttribute('data-np-font', '');
      document.head.appendChild(link);
    }
  }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || typeof e.data.type !== 'string' || e.data.type.indexOf(P) !== 0) return;
    var type = e.data.type.slice(P.length);
    if (type === 'theme') { applyTheme(e.data.theme); themeHandlers.forEach(function (fn) { fn(e.data.theme); }); }
    if (type === 'parent' && typeof e.data.url === 'string' && /^https?:\/\//.test(e.data.url)) kit.shareUrl = e.data.url;
    if (type === 'restore') { lastRestore = e.data; restoreHandlers.forEach(function (fn) { fn(e.data.state, e.data); }); }
  });
  var kit = {
    /** true เมื่อเปิดอยู่ในเว็บ NetPrime, false เมื่อเปิดไฟล์ตรง ๆ */
    embedded: embedded,
    /** ลิงก์หน้าบทเรียนบนเว็บ ใช้กับปุ่มแชร์ (null จนกว่าเว็บจะส่งมา) */
    shareUrl: null,
    /** เรียกเมื่อเว็บส่งธีม (ตัวแปร --np-* ถูกตั้งให้แล้ว) */
    onTheme: function (fn) { themeHandlers.push(fn); },
    /** เรียกเมื่อเว็บส่งความคืบหน้าที่บันทึกไว้ของผู้เรียนที่ login อาจถูกเรียกซ้ำได้ ต้องรวมค่าแบบเรียกกี่ครั้งก็ได้ผลเท่าเดิม */
    onRestore: function (fn) { restoreHandlers.push(fn); if (lastRestore) fn(lastRestore.state, lastRestore); },
    /** บันทึกความคืบหน้า: percent 0-100, completed true เมื่อเรียนครบ, state เป็น JSON อะไรก็ได้ไม่เกิน 64 KB */
    saveProgress: function (progress) {
      clearTimeout(timer);
      timer = setTimeout(function () {
        send('progress', {
          percent: Math.max(0, Math.min(100, Math.round(Number(progress.percent) || 0))),
          completed: progress.completed === true,
          state: progress.state === undefined ? null : progress.state
        });
      }, 800);
    },
    /** ให้แถบที่อยู่ของเว็บจำตำแหน่ง เช่น 'step-2' (a-z, 0-9, ขีดกลาง) */
    setLocation: function (hash) { send('location', { hash: hash }); },
    /** ส่งความสูงของเนื้อหาให้กรอบบนเว็บ (เรียกเองอัตโนมัติเมื่อขนาดเปลี่ยน) */
    resize: function () { send('height', { height: Math.ceil(document.body.scrollHeight) }); }
  };
  window.NetPrimeLesson = kit;
  if ('ResizeObserver' in window) new ResizeObserver(function () { kit.resize(); }).observe(document.body);
  window.addEventListener('load', function () { kit.resize(); send('ready'); });
})();
</script>
<!-- ========== จบ Lesson Kit ========== -->

<script>
/* ---------- เนื้อหาบทเรียน: แก้ส่วนนี้ ---------- */
const STEPS = [
  { title: 'ทำความรู้จัก', body: '<p>อธิบายภาพรวมของหัวข้อนี้ เขียนเป็น HTML ได้ เช่น <strong>ตัวหนา</strong> หรือรายการ</p>' },
  { title: 'ลงมือดู', body: '<p>ใส่ตัวอย่าง แผนภาพ SVG หรือภาพเคลื่อนไหวที่ช่วยให้เข้าใจ</p>' },
  { title: 'สรุป', body: '<p>สรุปประเด็นสำคัญ 2-3 ข้อก่อนทำแบบฝึกหัด</p>' }
];
const QUIZ = { question: 'คำถามทบทวนหนึ่งข้อ', options: ['คำตอบที่ถูก', 'ตัวเลือกที่ผิด', 'ตัวเลือกที่ผิดอีกข้อ'], answer: 0 };

/* ---------- การทำงาน: ปกติไม่ต้องแก้ ---------- */
const KEY = 'netprime-template-progress';   // เปลี่ยนชื่อให้ไม่ซ้ำกับบทเรียนอื่น
const kit = window.NetPrimeLesson;
const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
let state = Object.assign({ seen: [], passed: false }, read());
let current = 0;

const $ = id => document.getElementById(id);
const percent = () => Math.round(((state.seen.length + (state.passed ? 1 : 0)) / (STEPS.length + 1)) * 100);

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ไม่มีที่เก็บก็ยังเรียนได้ */ }
  kit.saveProgress({ percent: percent(), completed: state.passed && state.seen.length === STEPS.length, state });
}

function render() {
  const onQuiz = current === STEPS.length;
  if (!onQuiz && !state.seen.includes(current)) { state.seen.push(current); save(); }
  $('stepList').innerHTML = '';
  [...STEPS.map(s => s.title), 'แบบฝึกหัด'].forEach((title, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = title;
    if (i === current) b.setAttribute('aria-current', 'step');
    if (state.seen.includes(i) || (i === STEPS.length && state.passed)) b.className = 'seen';
    b.onclick = () => { current = i; render(); };
    li.append(b); $('stepList').append(li);
  });
  const card = $('stepCard');
  if (onQuiz) {
    card.innerHTML = `<h2>แบบฝึกหัด</h2><p>${QUIZ.question}</p><div class="quiz" id="quiz"></div><p class="done" id="quizDone">${state.passed ? 'ผ่านแบบฝึกหัดแล้ว' : ''}</p>`;
    QUIZ.options.forEach((text, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = text;
      b.onclick = () => {
        b.className = i === QUIZ.answer ? 'right' : 'wrong';
        if (i === QUIZ.answer && !state.passed) { state.passed = true; save(); $('quizDone').textContent = 'ผ่านแบบฝึกหัดแล้ว'; drawProgress(); render(); }
      };
      $('quiz').append(b);
    });
  } else {
    card.innerHTML = `<h2>${STEPS[current].title}</h2>${STEPS[current].body}`;
  }
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = onQuiz;
  kit.setLocation(onQuiz ? 'quiz' : `step-${current + 1}`);
  drawProgress();
}

function drawProgress() {
  $('progressText').textContent = state.passed && state.seen.length === STEPS.length ? 'เรียนครบแล้ว' : `เรียนไปแล้ว ${percent()}%`;
  $('progressBar').style.width = `${percent()}%`;
}

/* ผู้เรียนที่ login: รวมความคืบหน้าที่บันทึกไว้ในระบบกับในเครื่องนี้ (เรียกซ้ำได้ ผลเท่าเดิม) */
kit.onRestore(saved => {
  if (!saved || typeof saved !== 'object') { save(); return; }
  state.seen = [...new Set([...state.seen, ...(Array.isArray(saved.seen) ? saved.seen.filter(Number.isInteger) : [])])];
  state.passed = state.passed || saved.passed === true;
  save(); render();
});

$('prevBtn').onclick = () => { current = Math.max(0, current - 1); render(); };
$('nextBtn').onclick = () => { current = Math.min(STEPS.length, current + 1); render(); };
const start = /^#step-(\d+)$/.exec(location.hash);
if (location.hash === '#quiz') current = STEPS.length;
else if (start) current = Math.min(STEPS.length - 1, Math.max(0, Number(start[1]) - 1));
render();
</script>
</body>
</html>
