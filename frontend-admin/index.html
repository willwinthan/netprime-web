<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- PWA (public/manifest.webmanifest, public/sw.js registered by src/pwa/pwa.tsx) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#c2541a" />
    <!-- Saved brand theme (src/components/builder/theme.tsx), applied before first paint. -->
    <script>try{var t=JSON.parse(localStorage.getItem("netprime.theme.vars")||"null");if(t&&t.vars){for(var k in t.vars)if(/^--[a-z0-9-]+$/.test(k)&&typeof t.vars[k]==="string"&&!/[;{}<>]/.test(t.vars[k]))document.documentElement.style.setProperty(k,t.vars[k]);}}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetPrime LMS — ระบบเรียนออนไลน์และอบรมด้าน IT</title>
    <!-- Defaults; the frontend Worker (worker/index.ts) replaces these per page with absolute URLs. -->
    <meta name="description" content="อบรม Network, Cloud และ Security ทั้งคอร์สออนไลน์และรอบอบรมกับผู้สอน พร้อมใบประกาศนียบัตรที่ตรวจสอบได้ออนไลน์" />
    <meta property="og:site_name" content="NetPrime" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NetPrime LMS — ระบบเรียนออนไลน์และอบรมด้าน IT" />
    <meta property="og:image" content="/og-default.jpg" />
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@100..700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/pwa/boot.tsx"></script>
  </body>
</html>
