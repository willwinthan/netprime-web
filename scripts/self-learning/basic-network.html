:root {
  color-scheme: light dark;
  --bg: #edf3ef; --surface: #ffffff; --ink: #14282a; --muted: #4f6663; --line: #cfdcd6; --track: #bccbc4;
  --accent: #0b7a6e; --accent-ink: #ffffff; --packet: #ffc21a; --packet-ink: #14282a; --danger: #c42b3b;
  --l2: #6d4fe0; --l2s: rgba(109,79,224,.17); --l3: #1a6bc4; --l3s: rgba(26,107,196,.16);
  --l4: #2b7a3d; --l4s: rgba(43,122,61,.17); --l7: #c2286a; --l7s: rgba(194,40,106,.14);
  --sec: #96540a; --secs: rgba(201,122,0,.2);
  --zone: rgba(237, 243, 239, .78);
  /* Design Tokens: แก้ที่นี่เมื่อปรับแบรนด์ */
  --r-s: 4px; --r-m: 10px; --r-btn: 8px; --r-card: 14px;
  --fs-xs: .8125rem; --fs-sm: .875rem; --fs-md: 1rem; --fs-lg: 1.0625rem; --fs-xl: 1.3125rem;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --body: 'Anuphan','Noto Sans Thai','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --display: 'Chakra Petch','Anuphan','Noto Sans Thai',system-ui,sans-serif;
  --mono: 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1c1a; --surface: #162826; --ink: #e9f2ee; --muted: #9db5ac; --line: #2b4440; --track: #3a5650;
    --accent: #4fd1b8; --accent-ink: #06231e; --packet: #ffc933; --packet-ink: #14282a; --danger: #ff7b86;
    --l2: #b09bff; --l2s: rgba(176,155,255,.2); --l3: #6db7f8; --l3s: rgba(109,183,248,.2);
    --l4: #7fd68f; --l4s: rgba(127,214,143,.18); --l7: #ff8ab5; --l7s: rgba(255,138,181,.18);
    --sec: #f5b64b; --secs: rgba(245,182,75,.2);
    --zone: rgba(14, 28, 26, .72);
  }
}
:root[data-theme="dark"] {
  --bg: #0e1c1a; --surface: #162826; --ink: #e9f2ee; --muted: #9db5ac; --line: #2b4440; --track: #3a5650;
  --accent: #4fd1b8; --accent-ink: #06231e; --packet: #ffc933; --packet-ink: #14282a; --danger: #ff7b86;
  --l2: #b09bff; --l2s: rgba(176,155,255,.2); --l3: #6db7f8; --l3s: rgba(109,183,248,.2);
  --l4: #7fd68f; --l4s: rgba(127,214,143,.18); --l7: #ff8ab5; --l7s: rgba(255,138,181,.18);
  --sec: #f5b64b; --secs: rgba(245,182,75,.2);
  --zone: rgba(14, 28, 26, .72);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--body); overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-s); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.3; margin: 0; }
p { margin: 0; }
.tone-l2 { --c: var(--l2); --cs: var(--l2s); } .tone-l3 { --c: var(--l3); --cs: var(--l3s); }
.tone-l4 { --c: var(--l4); --cs: var(--l4s); } .tone-l7 { --c: var(--l7); --cs: var(--l7s); }
.tone-sec { --c: var(--sec); --cs: var(--secs); }
.tone-pk { --c: #d99a00; --cs: rgba(255,194,26,.25); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.p-only, .nar-only, .mob-only { display: none; }

.app { max-width: 1680px; margin: 0 auto; padding: 12px 20px 20px; }

/* ---------- แถบบน ---------- */
.top { display: flex; align-items: center; gap: 8px 20px; padding-bottom: 8px; flex-wrap: wrap; }
.brand { font: 600 1.2rem/1.25 var(--display); margin-right: auto; }
.brand small { display: block; font: 400 .8125rem/1.35 var(--body); color: var(--muted); }
.prog { display: flex; align-items: baseline; gap: 6px; font-size: .8125rem; color: var(--muted); }
.prog b { font: 600 1.25rem var(--display); color: var(--accent); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-ghost { min-height: 36px; padding: 4px 12px; border: 1.5px solid var(--line); border-radius: var(--r-btn); background: var(--surface); font-size: .875rem; color: var(--ink); white-space: nowrap; }
.btn-ghost:hover { border-color: var(--ink); }
.sharemsg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 6px 12px; margin-bottom: 10px; font-size: .9375rem; }
.keys { color: var(--muted); font-size: .875rem; }
.lnk { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; font-size: .9375rem; }

/* ---------- เส้นทางบทเรียน ---------- */
.line { display: flex; gap: 10px; margin-bottom: 10px; }
.ln-g { flex: var(--n, 1) 1 0; min-width: 0; }
.ln-g:nth-child(1) { flex: 1 1 0; } .ln-g:nth-child(2) { flex: 5 1 0; } .ln-g:nth-child(3) { flex: 2 1 0; } .ln-g:nth-child(4) { flex: 3 1 0; } .ln-g:nth-child(5) { flex: 3 1 0; } .ln-g:nth-child(6) { flex: 2 1 0; }
.ln-t { font-size: var(--fs-xs); color: var(--muted); padding-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln-g ol { list-style: none; margin: 0; padding: 0; display: flex; position: relative; }
.ln-g ol::before { content: ''; position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--c); }
.ln-g li { flex: 1 1 0; min-width: 0; position: relative; }
.les { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 4px 0 2px; border-radius: var(--r-btn); line-height: 1.2; }
.les:hover { background: var(--surface); }
.les b { font: 600 var(--fs-sm)/1.25 var(--display); white-space: nowrap; }
.les .st { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); position: relative; }
.les .st.half { background: linear-gradient(90deg, var(--c) 50%, var(--surface) 50%); }
.les .st.view { background: var(--cs); box-shadow: inset 0 0 0 3px var(--surface); }
.les .st.pass { background: var(--c); }
.les .st.pass::after { content: '✓'; position: absolute; inset: -4px; display: grid; place-items: center; color: var(--surface); font: 600 .75rem var(--body); }
.les[aria-current="true"] .st { width: 26px; height: 26px; margin: -3px 0; background: var(--packet); border-color: var(--ink); }
.les[aria-current="true"] b { font-size: .9375rem; }

/* ---------- วิธีอ่าน ---------- */
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 4px 14px; margin-bottom: 10px; }
.guide[hidden] { display: none; }
.glossary > summary { cursor: pointer; font-weight: 600; font-size: .9375rem; min-height: 30px; display: list-item; }
.guide-c { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; padding: 6px 0 8px; }
.guide-c h3 { font-size: 1rem; }
.guide-c p { font-size: .9375rem; color: var(--muted); }
.glossary { border-top: 1px solid var(--line); padding: 6px 0; }
.glossary dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; margin: 8px 0; }
.glossary dt { font-weight: 600; }
.glossary dd { margin: 0; font-size: .9375rem; color: var(--muted); }

/* ---------- โครงหน้า ---------- */
.board { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: 644px auto auto auto auto;
  grid-template-areas: "center step" "trans trans" "flow flow" "after after" "foot foot"; }
.center { grid-area: center; display: flex; flex-direction: column; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-card); min-height: 0; min-width: 0; padding: 10px 14px; }
.steppane { grid-area: step; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-card); padding: 12px 16px; overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
.transport { grid-area: trans; display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.flow { grid-area: flow; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-card); padding: 8px 14px; min-width: 0; }
.insp { grid-column: center-start / step-end; grid-row: center-start / center-end; display: none; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-card); padding: 10px 14px; }
html.insp-open .insp { display: flex; }
html.insp-open:not(.present) .center, html.insp-open:not(.present) .steppane { display: none; }
.after { grid-area: after; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 10px; }
.after[hidden] { display: none; }
.foot { grid-area: foot; font-size: .8125rem; color: var(--muted); max-width: 95ch; }
.lessel { display: none; font-size: .875rem; color: var(--muted); }
.lessel select { display: block; width: 100%; min-height: 44px; margin-top: 2px; padding: 0 10px; font: 600 1rem var(--body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-btn); }

/* ---------- หัวข้อและขั้นบนเวที ---------- */
.stage-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; flex: none; }
.st-name { min-width: 0; }
.st-name h1 { font-size: clamp(1.25rem, 1.9vw, 1.6rem); }
.st-name span { font-size: var(--fs-sm); color: var(--muted); }
.stops { list-style: none; margin: 8px 0 4px; padding: 0; display: flex; flex: none; overflow-x: auto; scrollbar-width: thin; position: relative; }
.stops li { flex: 1 1 0; min-width: 84px; position: relative; }
.stops li + li::before { content: ''; position: absolute; left: calc(-50% + 12px); right: calc(50% + 12px); top: 12px; height: 3px; background: var(--line); }
.stop { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; padding: 0 3px 3px; font-size: var(--fs-sm); line-height: 1.25; text-align: center; color: var(--muted); }
.stop:hover { color: var(--ink); }
.stop i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 .75rem var(--mono); border: 2px solid var(--line); background: var(--surface); color: var(--muted); position: relative; }

.stage-b { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; }
.tower { flex: none; width: 124px; align-self: center; }

#osi { display: flex; flex-direction: column; gap: 2px; }

#osi i b { font: 600 .75rem var(--mono); }

/* ---------- แผนภาพ ---------- */
.vtabs { display: flex; flex: none; }
.vtabs button { padding: 4px 12px; min-height: 34px; font-size: .875rem; font-weight: 600; color: var(--muted); border-bottom: 3px solid var(--line); }
.vtabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
#map { display: block; flex: 1 1 auto; min-width: 0; min-height: 0; height: 100%; touch-action: manipulation; border-radius: 10px; background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 18px 18px; }
.zone rect { fill: var(--zone); stroke: var(--line); stroke-width: 1; }
.zone text { fill: var(--muted); font: 600 12px var(--body); }
.link { fill: none; stroke: var(--track); stroke-width: 2.5; stroke-linecap: round; }
.port { fill: var(--surface); stroke: var(--track); stroke-width: 2; }
.route { fill: none; stroke: var(--c, var(--accent)); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }

@keyframes pe-flow { to { stroke-dashoffset: -28; } }
.node .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; filter: drop-shadow(0 3px 7px rgba(20, 40, 42, .13)); }
.node .gl { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.node .nm { fill: var(--ink); font: 600 14px var(--body); }
.node .nm-c { font-size: 12.5px; }
.node .nm-s { font-size: 12px; }
.node .ipt { fill: var(--muted); font: 400 11.5px var(--mono); }
.node .ipt-c { font-size: 11px; }
.node.via .card { stroke: var(--c, var(--accent)); stroke-width: 2; }
.node.src .card, .node.dst .card { stroke: var(--c, var(--accent)); stroke-width: 3; }
.node.hit .card { animation: pe-hit .55s ease-out; }
@keyframes pe-hit { 0% { stroke-width: 7; } 100% { stroke-width: 3; } }
.ntag rect { fill: var(--c, var(--accent)); }
.ntag text { fill: var(--surface); font: 600 12px var(--body); }
#tok rect.base { fill: var(--packet); stroke: var(--packet-ink); stroke-width: 1.5; filter: drop-shadow(0 2px 4px rgba(20, 40, 42, .3)); }
#tok text { fill: var(--packet-ink); font: 600 12px var(--mono); }
#tok text.thai { font-family: var(--body); }
#tok path { fill: none; stroke: var(--packet-ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#call rect { fill: var(--surface); stroke: var(--c, var(--accent)); stroke-width: 1.5; }
#call text { fill: var(--ink); font: 400 11.5px var(--mono); }
#call.nat rect { fill: var(--packet); stroke: var(--packet-ink); }
#call.nat text { fill: var(--packet-ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .route-flow, .node.hit .card { animation: none; } }

/* ---------- ลำดับแพ็กเก็ต ---------- */
.seq { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.seq[hidden] { display: none; }
.seq svg { display: block; width: 100%; }

.sq-div { stroke: var(--line); stroke-width: 1; }
.sq-dt { fill: var(--muted); font: 600 11.5px var(--body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.sq-skip { fill: var(--muted); font: 400 11.5px var(--body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.sq-h { fill: var(--ink); font: 600 13px var(--body); }
.sq-ip { fill: var(--muted); font: 400 11px var(--mono); }
.sq { cursor: pointer; }
.sq .hit { fill: transparent; }
.sq:hover .hit { fill: var(--bg); }
.sq:focus-visible { outline: none; }

.sq.cur .hit { fill: var(--cs); }
.sq line { stroke: var(--c); stroke-width: 2; }
.sq.cur line { stroke-width: 3; }
.sq polygon { fill: var(--c); }
.sq .t { fill: var(--ink); font: 600 12px var(--mono); }
.sq .t.thai { font-family: var(--body); font-size: 12.5px; }
.sq .n { fill: var(--muted); font: 400 12px var(--mono); }
.sq .x { fill: none; stroke: var(--danger); stroke-width: 3; }

/* ---------- รายละเอียดขั้น ---------- */
.steppane .meta { font-size: var(--fs-sm); color: var(--accent); font-weight: 600; }
.st-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.st-top .lnk { min-height: 24px; font-size: .8125rem; white-space: nowrap; }
#ovPane[hidden], #stPane[hidden] { display: none; }
.ovsub { font-size: .9375rem; color: var(--muted); margin-bottom: 6px; }
.btn-main { display: block; width: 100%; min-height: 46px; padding: 6px 12px; text-align: center; font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: var(--r-btn); margin-top: 10px; }
.btn-main:hover { filter: brightness(1.08); }
.steppane h2 { font-size: var(--fs-xl); margin: 2px 0 6px; }
#sTitle:focus { outline: none; }
.intro { color: var(--muted); font-size: .9375rem; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.intro[hidden] { display: none; }
.txt { font-size: var(--fs-lg); line-height: 1.65; }
.skipnote { font-size: var(--fs-sm); color: var(--muted); border-left: 3px dashed var(--track); padding-left: 8px; margin-top: 6px; }
.skipnote[hidden] { display: none; }
.look { font-size: var(--fs-sm); margin-top: 8px; padding: 5px 8px; background: var(--cs); border-radius: var(--r-s); }
.look b { font-weight: 600; }
.term { display: inline; color: inherit; border-bottom: 1.5px dotted var(--accent); line-height: inherit; }
.term:hover { color: var(--accent); }
.gl { background: var(--bg); border-left: 3px solid var(--accent); padding: 6px 10px; margin-top: 8px; font-size: .9375rem; }
.gl .lnk { min-height: 0; margin-left: 6px; }
.caplinks { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 2px; }
.pcard { margin: 10px 0 8px; padding-top: 8px; border-top: 2px solid var(--c); }
.pc-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--fs-sm); color: var(--muted); }
.chip { background: var(--c); color: var(--surface); font: 600 .75rem/1.5 var(--mono); padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.chip.thai { font-family: var(--body); }
.pc-i { display: block; font: 400 var(--fs-sm)/1.45 var(--mono); margin: 5px 0 2px; }
.pc-m { font-size: var(--fs-xs); color: var(--muted); }
.pc-a { font: 400 var(--fs-xs)/1.5 var(--mono); color: var(--muted); }
.pf-h { font-size: .9375rem; margin-top: 10px; }
.chsub { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 4px; }
.pfacts { margin: 4px 0 0; }
.pfacts div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); font-size: var(--fs-sm); line-height: 1.4; }
.pfacts dt { color: var(--muted); }

.btn-solid { display: block; width: 100%; min-height: 42px; padding: 6px 12px; text-align: center; font-weight: 600; font-size: .9375rem; color: var(--accent); border: 2px solid var(--accent); border-radius: var(--r-btn); margin-top: 8px; }
.btn-solid:hover { background: var(--accent); color: var(--accent-ink); }

/* ---------- ปุ่มควบคุม ---------- */
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; }
.ctrl button { min-height: 44px; min-width: 44px; padding: 6px 16px; border: 1.5px solid var(--line); border-radius: var(--r-btn); background: var(--surface); text-align: center; font-weight: 600; font-size: .9375rem; white-space: nowrap; }
.ctrl button:hover:not(:disabled) { border-color: var(--ink); }
.ctrl button:disabled { opacity: .4; cursor: default; }
.ctrl .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ctrl .primary:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }
.ctrl select { min-height: 44px; border: 1.5px solid var(--line); border-radius: var(--r-btn); background: var(--surface); color: inherit; font: inherit; font-size: .9375rem; padding: 0 10px; }
.bar { flex: 1 1 200px; display: flex; gap: 3px; min-width: 0; }
.bar button { flex: 1; min-width: 0; height: 24px; position: relative; }
.bar button::after { content: ''; position: absolute; left: 0; right: 0; top: 9px; height: 6px; background: var(--line); border-radius: 3px; }
.bar button.done::after { background: var(--muted); }
.bar button[aria-current="step"]::after { background: var(--accent); }

/* ---------- Packet Flow ---------- */
.flowhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; margin-bottom: 4px; }
.flowhead h2 { font-size: 1.0625rem; }
.lg { font-size: var(--fs-sm); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.lg i { width: 10px; height: 10px; border-radius: 50%; }
.d-out { background: var(--accent); } .d-back { background: var(--l4); } .d-lost { background: var(--danger); }
.ft { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); table-layout: auto; }
.ft th { position: sticky; top: 0; background: var(--surface); text-align: left; font-weight: 600; color: var(--muted); font-size: var(--fs-xs); padding: 2px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ft td { padding: 3px 8px; font: 400 var(--fs-sm)/1.4 var(--mono); border-bottom: 1px solid transparent; }
.ft td.c-info { overflow-wrap: anywhere; }
.ft tr.row-p { cursor: pointer; }
.ft tr.row-p:hover td { background: var(--bg); }
.ft tr.cur td { background: var(--cs); font-weight: 600; }
.ft tr.cur td:first-child { border-radius: var(--r-btn) 0 0 8px; }
.ft tr.cur td:last-child { border-radius: 0 8px 8px 0; }
.ft tr.future { visibility: hidden; }
.ft .c-proto { color: var(--c); font-weight: 600; }
.ft .c-size { white-space: nowrap; text-align: right; }
.ft th.c-size { text-align: right; }
.ft .c-time, .ft .c-src, .ft .c-dst { white-space: nowrap; }
.fn { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 .75rem var(--mono); text-align: center; color: var(--surface); }
.ft .route-s { display: none; }
.ft tr.row-skip td { font: 400 var(--fs-xs)/1.4 var(--body); color: var(--muted); text-align: center; padding: 2px 8px; }
.flownote { flex: 1 1 100%; font-size: var(--fs-xs); color: var(--muted); }
.qpass { font-weight: 600; color: var(--l4); min-height: 1.6em; }

/* ---------- แกะแพ็กเก็ต ---------- */
.hint { color: var(--muted); font-size: var(--fs-sm); margin: 2px 0 6px; }
.ih { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ih-t { flex: 1 1 240px; min-width: 0; }
.ih-t b { display: block; font: 600 1.0625rem/1.3 var(--display); }
.ih-t span { font: 400 var(--fs-xs)/1.4 var(--mono); color: var(--muted); }
.ih-b { display: flex; gap: 4px; }
.ih-b button { min-height: 34px; padding: 3px 10px; border: 1px solid var(--line); border-radius: var(--r-s); font-size: .8125rem; font-weight: 600; }
.ih-b button:hover:not(:disabled) { border-color: var(--ink); }
.ih-b button:disabled { opacity: .4; cursor: default; }
.lbar { display: flex; gap: 2px; margin-bottom: 8px; flex: none; }
.lb { min-width: 0; padding: 3px 7px 2px; border-top: 4px solid var(--c); background: var(--cs); border-radius: 0 0 3px 3px; line-height: 1.25; }
.lb b { display: block; font: 600 .8125rem var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb span { display: block; font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; }
.lb[aria-pressed="true"] { outline: 2px solid var(--c); outline-offset: -2px; }
.ibody { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 560px; gap: 12px; }
.ilist { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.ihex { min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.il { padding-bottom: 8px; }
.il h3 { font-size: var(--fs-md); color: var(--c); padding-left: 8px; border-left: 3px solid var(--c); }
.il-d { font-size: var(--fs-sm); color: var(--muted); padding: 1px 0 4px 11px; }
.fr { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 0 10px; width: 100%; padding: 4px 6px 4px 11px; border-top: 1px solid var(--line); line-height: 1.4; }
.fr:hover { background: var(--cs); }
.fr[aria-pressed="true"] { background: var(--cs); box-shadow: inset 3px 0 0 var(--c); }
.fr-n { font-size: var(--fs-sm); color: var(--muted); grid-row: 1 / span 2; }
.fr-v { font: 600 var(--fs-sm)/1.4 var(--mono); }
.fr-d { font-size: var(--fs-sm); color: var(--muted); }
.fr[aria-pressed="true"] .fr-d, .fr[aria-pressed="true"] .fr-n { color: var(--ink); }
.bits { grid-column: 2; display: flex; flex-wrap: wrap; gap: 3px 4px; margin-top: 4px; }
.bits span { border: 1px solid var(--line); border-radius: var(--r-s); padding: 0 5px; font-size: .75rem; line-height: 1.5; color: var(--ink); }
.bits code { font-family: var(--mono); margin-right: 4px; }
.bits .on { background: var(--c); color: var(--surface); border-color: var(--c); font-weight: 600; }
.hexwrap { border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px 6px; }
.hexhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: var(--fs-sm); color: var(--muted); padding: 0 6px 6px; }
.chgkey[hidden] { display: none; }
.chgkey { display: inline-flex; gap: 6px; align-items: center; }
.chgkey::before { content: ''; width: 14px; height: 14px; box-shadow: inset 0 0 0 2px var(--danger); border-radius: 2px; }
.hexmsg { margin: 0 6px 6px; padding: 4px 8px; border-left: 3px solid var(--line); font-size: .9375rem; }
.hexmsg.ok { border-left-color: var(--l4); background: var(--l4s); }
.hexmsg.no { border-left-color: var(--danger); }
.hex { --z: 1; font: 400 calc(13px * var(--z))/calc(22px * var(--z)) var(--mono); max-height: 422px; overflow-y: auto; overscroll-behavior: contain; }
.row { display: flex; align-items: stretch; padding: 0 6px; white-space: pre; }
.off { width: calc(40px * var(--z)); flex: none; color: var(--muted); font-size: calc(11.5px * var(--z)); user-select: none; }
.rhead { position: sticky; top: 0; z-index: 1; background: var(--surface); font: 400 calc(12px * var(--z))/calc(22px * var(--z)) var(--body); color: var(--muted); }
.rhead .rb { flex: none; }
.rhead .asc { color: inherit; }
.byts { display: flex; flex: none; }
.by { width: var(--bw, 25px); text-align: center; cursor: pointer; background: var(--cs); }
.by.gap { margin-left: 5px; }
.asc { display: flex; margin-left: calc(12px * var(--z)); flex: none; color: var(--muted); }
.ch { width: calc(9px * var(--z)); text-align: center; cursor: pointer; }
.ch.hi { color: var(--ink); font-weight: 600; }
.by.sel { background: var(--c); color: var(--surface); font-weight: 600; }
.ch.sel { background: var(--c); color: var(--surface); }
.by.hov { box-shadow: inset 0 -2px 0 var(--c); }
.by.chg { box-shadow: inset 0 0 0 2px var(--danger); }

/* ---------- สรุปและแบบฝึกหัด ---------- */
.keep { border-left: 4px solid var(--accent); padding: 2px 0 2px 12px; }
.keep b { font-family: var(--display); }
.cta { display: inline-block; margin-left: 4px; padding: 3px 12px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
.quiz { border-top: 1px solid var(--line); padding-top: 10px; }
.quiz[hidden], .keep[hidden] { display: none; }
.quiz h3 { font-size: 1.0625rem; margin-bottom: 4px; }
.quiz .q { font-weight: 600; margin-top: 4px; }
.qopts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.qopt { min-height: 44px; padding: 6px 14px; border: 1px solid var(--line); border-radius: var(--r-s); text-align: left; }
.qopt:hover:not(:disabled) { border-color: var(--ink); }
.qopt:disabled { opacity: .55; cursor: default; }
.qopt.ok { border-color: var(--l4); background: var(--l4s); font-weight: 600; opacity: 1; }
.qopt.no { text-decoration: line-through; }
.qv { min-height: 1.6em; }

/* ---------- จอเล็กลง ---------- */
@media (max-width: 1180px) {
  .line, .desk-only { display: none; }
  .board { grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto 648px auto auto auto auto;
    grid-template-areas: "sel sel" "center step" "trans trans" "flow flow" "after after" "foot foot"; }
  .lessel { display: block; grid-area: sel; }
  .glossary dl { grid-template-columns: minmax(0, 1fr); }
  .stage-b { flex-direction: column; gap: 6px; }
  #map { flex: 1 1 0; height: 0; width: 100%; }
  .tower { width: 100%; align-self: stretch; }
  #osi { flex-direction: row-reverse; }
  #osi i { flex: 1; justify-content: center; }
  #osi i span { display: none; }
}
@media (max-width: 860px) {
  .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: none;
    grid-template-areas: "sel" "center" "trans" "step" "flow" "after" "foot"; }
  #map { flex: none; height: auto; width: 100%; }
  .seq { max-height: 420px; }
  .steppane { overflow: visible; }
  .ft tr.future { display: none; }
  .guide-c { grid-template-columns: minmax(0, 1fr); }
  .ibody { display: flex; flex-direction: column-reverse; }
  .ilist, .ihex { overflow: visible; }
  .hex { max-height: none; overflow: visible; }
  .nar-only { display: inline-block; }
}
@media (max-width: 680px) {
  .app { padding: 10px 12px 20px; }
  .brand { flex: 1 1 100%; }
  .prog { flex: 1 1 100%; }
  .ctrl { width: 100%; }
  .ctrl button { flex: 1; padding: 6px 6px; }
  .ctrl select { flex: 1 1 100%; min-height: 40px; }
  .bar { flex: 1 1 100%; }
  .ft .c-time, .ft .c-src, .ft .c-dst, .ft .c-size { display: none; }
  .ft:not(.all) tr.row-p:not(.cur), .ft:not(.all) tr.row-skip:not(.near) { display: none; }
  .mob-only { display: inline-block; }
  .mob-only[hidden] { display: none; }
  .hex { font-size: 12.5px; line-height: 28px; }
  .ft .route-s { display: block; font-size: .75rem; color: var(--muted); font-weight: 400; }
  .ft td { padding: 3px 6px; }
  .fr { grid-template-columns: minmax(0, 1fr); }
  .fr-n { grid-row: auto; }
  .bits { grid-column: 1; }
  .hex { font-size: 12px; }
  .off { width: 34px; font-size: 11px; }
  .asc { margin-left: 8px; }
  .ch { width: 8px; }
}

/* ---------- โหมดสอน ---------- */
html.present { font-size: clamp(16px, 1.25vw, 26px); }
html.present body { font-size: 1rem; }
html.present .p-only { display: inline-flex; align-items: center; }
html.present p.keys { display: block; order: 9; margin: 3px 0 0; font-size: .75rem; }
html.present .app { max-width: none; padding: 6px 1.6vw 6px; display: flex; flex-direction: column; min-height: 100vh; }
html.present .board { flex: 1; grid-template-columns: minmax(0, 1fr) 29vw; grid-template-rows: auto calc(100vh - 21.5rem) auto auto auto; align-content: start;
  grid-template-areas: "sel sel" "center step" "trans trans" "flow flow" "after after"; gap: 6px; }
html.present #stPane .pf-h, html.present #stPane .pfacts, html.present #stPane .pc-a, html.present #stPane .chsub, html.present .flowhead .lg { display: none; }
html.present .stops { margin: 2px 0; }

html.present .center { padding: 4px 12px; }

<body>
<noscript>หน้านี้แสดงแพ็กเก็ตแบบเคลื่อนไหว จึงต้องเปิดใช้ JavaScript</noscript>
<script>
/* ตัวสร้างแพ็กเก็ต: ทุกไบต์ถูกประกอบตามรูปแบบจริงของแต่ละโปรโตคอล พร้อม checksum ที่คำนวณจริง */
const PX = (() => {
  'use strict';
  const enc = s => Array.from(new TextEncoder().encode(s));
  const u16 = n => [(n >>> 8) & 255, n & 255];
  const u24 = n => [(n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const ipb = s => s.split('.').map(Number);
  const macb = s => s.split(':').map(h => parseInt(h, 16));
  const hex = (n, w) => '0x' + n.toString(16).padStart(w, '0');
  const bin = (n, w) => n.toString(2).padStart(w, '0');
  const zeros = n => new Array(n).fill(0);

  function csum(b) {
    let s = 0;
    for (let i = 0; i < b.length; i += 2) s += (b[i] << 8) + (b[i + 1] || 0);
    while (s >>> 16) s = (s & 0xffff) + (s >>> 16);
    return ~s & 0xffff;
  }

  /* สุ่มแบบกำหนดค่าเริ่มได้ ไฟล์จึงให้ไบต์เดิมทุกครั้งที่เปิด */
  function rnd(n, seed) {
    let h = 2166136261;
    for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
    const out = [];
    for (let i = 0; i < n; i++) {
      h = (h + 0x6d2b79f5) | 0;
      let t = Math.imul(h ^ (h >>> 15), 1 | h);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      out.push(((t ^ (t >>> 14)) >>> 0) & 255);
    }
    return out;
  }

  const f = (key, name, b, val, desc, bits) => ({ key, name, b, val, desc, bits });
  const layer = (id, label, tone, fields) => ({ id, label, tone, fields });
  const flat = layers => layers.flatMap(l => l.fields.flatMap(x => x.b));

  const MAC_NAMES = {
    '02:42:ac:11:00:14': 'แล็ปท็อป',
    '02:1a:2b:3c:4d:5e': 'เราเตอร์บ้าน ฝั่งในบ้าน',
    '02:1a:2b:3c:4d:5f': 'เราเตอร์บ้าน ฝั่งอินเทอร์เน็ต',
    '02:aa:bb:cc:00:01': 'เราเตอร์ของ ISP',
    '02:aa:bb:cc:00:02': 'เราเตอร์ที่อยู่ติดกับเซิร์ฟเวอร์',
    '02:50:00:00:00:50': 'เว็บเซิร์ฟเวอร์',
    '02:50:00:00:00:53': 'DNS resolver',
    'ff:ff:ff:ff:ff:ff': 'ทุกเครื่องในวงเดียวกัน',
  };
  const MAC = {
    laptop: '02:42:ac:11:00:14', routerLan: '02:1a:2b:3c:4d:5e', routerWan: '02:1a:2b:3c:4d:5f',
    isp: '02:aa:bb:cc:00:01', edge: '02:aa:bb:cc:00:02', web: '02:50:00:00:00:50',
    resolver: '02:50:00:00:00:53', all: 'ff:ff:ff:ff:ff:ff',
  };
  const macVal = m => MAC_NAMES[m] ? `${m} (${MAC_NAMES[m]})` : m;

  function ethLayer(dst, src, etype = 0x0800) {
    return layer('eth', 'Ethernet', 'l2', [
      f('dst', 'MAC ปลายทาง', macb(dst), macVal(dst), 'เครื่องถัดไปที่ต้องรับเฟรมนี้ในเครือข่ายวงเดียวกัน ไม่จำเป็นต้องเป็นปลายทางสุดท้าย ค่านี้ถูกเขียนใหม่ทุกครั้งที่ผ่านเราเตอร์'),
      f('src', 'MAC ต้นทาง', macb(src), macVal(src), 'การ์ดเครือข่ายที่ส่งเฟรมนี้ออกมา'),
      etype === 0x0806
        ? f('type', 'ชนิดข้อมูลข้างใน', u16(etype), '0x0806 (ARP)', 'บอกเครื่องรับว่าสิ่งที่อยู่ถัดไปคือข้อความ ARP')
        : f('type', 'ชนิดข้อมูลข้างใน', u16(etype), '0x0800 (IPv4)', 'บอกเครื่องรับว่าสิ่งที่อยู่ถัดไปคือแพ็กเก็ต IPv4'),
    ]);
  }

  const PROTO = { 1: 'ICMP', 6: 'TCP', 17: 'UDP' };
  function ipLayer(o, payloadLen) {
    const total = 20 + payloadLen;
    const flagWord = o.df ? 0x4000 : 0;
    const head = [0x45, 0, ...u16(total), ...u16(o.id), ...u16(flagWord), o.ttl, o.proto, 0, 0, ...ipb(o.src), ...ipb(o.dst)];
    const ck = csum(head);
    return layer('ip', 'IPv4', 'l3', [
      f('verihl', 'เวอร์ชันและความยาวส่วนหัว', [0x45], '4 และ 20 ไบต์', 'ไบต์เดียวเก็บสองค่า ครึ่งแรกคือเวอร์ชัน IP ครึ่งหลังคือความยาวส่วนหัว นับเป็นก้อนละ 4 ไบต์',
        [{ n: 'เวอร์ชัน', b: '0100', v: '4' }, { n: 'ความยาวส่วนหัว', b: '0101', v: '5 × 4 = 20 ไบต์' }]),
      f('tos', 'ระดับบริการ', [0], '0 (ทั่วไป)', 'ใช้ขอให้เครือข่ายจัดลำดับความสำคัญ แพ็กเก็ตทั่วไปมักเป็น 0'),
      f('len', 'ความยาวทั้งแพ็กเก็ต', u16(total), `${total} ไบต์`, 'นับตั้งแต่ส่วนหัว IP ไปจนจบข้อมูล ไม่รวม Ethernet'),
      f('id', 'หมายเลขแพ็กเก็ต', u16(o.id), String(o.id), 'ใช้ประกอบชิ้นส่วนกลับคืน ถ้าแพ็กเก็ตถูกหั่นระหว่างทาง'),
      f('frag', 'แฟล็กและตำแหน่งชิ้นส่วน', u16(flagWord), o.df ? 'ห้ามหั่น (DF)' : 'หั่นได้', 'DF บอกเราเตอร์ว่าห้ามหั่นแพ็กเก็ตนี้ ถ้าใหญ่เกินไปให้แจ้งกลับแทน',
        [{ n: 'สงวนไว้', b: '0', v: '' }, { n: 'DF ห้ามหั่น', b: o.df ? '1' : '0', on: !!o.df }, { n: 'MF ยังมีชิ้นต่อ', b: '0' }, { n: 'ตำแหน่งชิ้นส่วน', b: bin(0, 13), v: '0' }]),
      f('ttl', 'TTL', [o.ttl], `เหลือ ${o.ttl} ฮอป`, 'เราเตอร์ทุกตัวลดค่านี้ลง 1 ถ้าถึง 0 แพ็กเก็ตจะถูกทิ้ง จึงไม่มีแพ็กเก็ตที่วนอยู่ในเครือข่ายตลอดไป'),
      f('proto', 'โปรโตคอลข้างใน', [o.proto], `${o.proto} (${PROTO[o.proto]})`, 'บอกว่าข้อมูลถัดจากส่วนหัวนี้ต้องส่งให้โปรโตคอลอะไรอ่านต่อ'),
      f('cksum', 'Checksum ส่วนหัว', u16(ck), hex(ck, 4), 'เลขตรวจความเสียหายของส่วนหัว IP ต้องคำนวณใหม่ทุกครั้งที่ TTL หรือที่อยู่เปลี่ยน'),
      f('srcip', 'IP ต้นทาง', ipb(o.src), o.src, 'ที่อยู่ของผู้ส่ง ตามที่เห็น ณ จุดนี้ของเส้นทาง'),
      f('dstip', 'IP ปลายทาง', ipb(o.dst), o.dst, 'ที่อยู่ที่เราเตอร์ทุกตัวใช้ตัดสินว่าจะส่งต่อไปทางไหน'),
    ]);
  }

  const PORTS = { 21: 'FTP', 22: 'SSH', 25: 'SMTP', 53: 'DNS', 67: 'DHCP เซิร์ฟเวอร์', 68: 'DHCP ไคลเอนต์', 80: 'HTTP', 110: 'POP3', 123: 'NTP', 143: 'IMAP', 443: 'HTTPS' };
  const portVal = p => PORTS[p] ? `${p} (${PORTS[p]})` : `${p} (พอร์ตชั่วคราว)`;
  const pseudo = (src, dst, proto, len) => [...ipb(src), ...ipb(dst), 0, proto, ...u16(len)];

  const SYN_OPTS = [0x02, 0x04, 0x05, 0xb4, 0x01, 0x01, 0x04, 0x02, 0x01, 0x03, 0x03, 0x07];
  const FLAG_BITS = ['CWR', 'ECE', 'URG', 'ACK', 'PSH', 'RST', 'SYN', 'FIN'];

  /* เลขเริ่มต้นในบทเรียนลงท้ายด้วย 0000 จึงแปลงเป็นเลขนับจากเริ่มต้นได้ */
  const rel = n => n % 10000;
  function tcpLayer(o, payload) {
    const opts = o.opts || [];
    const off = 5 + opts.length / 4;
    let flags = 0;
    FLAG_BITS.forEach((n, i) => { if (o.flags.includes(n)) flags |= 1 << (7 - i); });
    const word = (off << 12) | flags;
    const seg = [...u16(o.sport), ...u16(o.dport), ...u32(o.seq), ...u32(o.ack), ...u16(word), ...u16(o.win), 0, 0, 0, 0, ...opts, ...payload];
    const ck = csum([...pseudo(o.src, o.dst, 6, seg.length), ...seg]);
    const hasAck = o.flags.includes('ACK');
    const fields = [
      f('sport', 'พอร์ตต้นทาง', u16(o.sport), portVal(o.sport), 'แยกว่าโปรแกรมไหนในเครื่องเป็นผู้ส่ง ฝั่งไคลเอนต์มักได้เลขชั่วคราวจากระบบปฏิบัติการ'),
      f('dport', 'พอร์ตปลายทาง', u16(o.dport), portVal(o.dport), 'บอกว่าข้อมูลนี้เป็นของบริการไหนบนเครื่องปลายทาง'),
      f('seq', 'เลขลำดับ', u32(o.seq), `${rel(o.seq)} (ค่าจริง ${o.seq})`, 'ตำแหน่งของไบต์แรกในแพ็กเก็ตนี้ นับจากเลขเริ่มต้นของฝั่งนี้ ฝั่งรับใช้เรียงข้อมูลและรู้ว่าอะไรหายไป ของจริงเลขเริ่มต้นเป็นค่าสุ่ม'),
      f('ack', 'เลขตอบรับ', u32(o.ack), hasAck ? `${rel(o.ack)} (ค่าจริง ${o.ack})` : '0 (ยังไม่ใช้)', 'บอกอีกฝั่งว่าได้รับครบถึงตรงไหนแล้ว และไบต์ถัดไปที่ต้องการคือเลขนี้'),
      f('flags', 'ความยาวส่วนหัวและแฟล็ก', u16(word), o.flags.length ? o.flags.join(', ') : 'ไม่มี', 'แฟล็กคือสวิตช์บอกจุดประสงค์ของแพ็กเก็ต เช่น SYN ขอเริ่มคุย ACK ตอบรับ FIN ขอจบ',
        [{ n: 'ความยาวส่วนหัว', b: bin(off, 4), v: `${off} × 4 = ${off * 4} ไบต์` }, { n: 'สงวนไว้', b: '0000' },
          ...FLAG_BITS.map((n, i) => ({ n, b: (flags >> (7 - i)) & 1 ? '1' : '0', on: !!((flags >> (7 - i)) & 1) }))]),
      o.flags.includes('SYN')
        ? f('win', 'ขนาดหน้าต่าง', u16(o.win), `${o.win} ไบต์`, 'จำนวนข้อมูลที่ฝั่งนี้ยังรับได้ อีกฝั่งจึงไม่ส่งเร็วเกินกว่าที่รับไหว ในแพ็กเก็ต SYN ค่านี้ไม่ถูกคูณ')
        : f('win', 'ขนาดหน้าต่าง', u16(o.win), `${o.win} × 128 = ${o.win * 128} ไบต์`, 'จำนวนข้อมูลที่ฝั่งนี้ยังรับได้ อีกฝั่งจึงไม่ส่งเร็วเกินกว่าที่รับไหว ค่าในแพ็กเก็ตต้องคูณ 128 ตามที่ตกลงกันตอนจับมือ (Window scale 7)'),
      f('cksum', 'Checksum', u16(ck), hex(ck, 4), 'เลขตรวจความเสียหาย คำนวณจากส่วนหัว TCP ข้อมูล และที่อยู่ IP ทั้งสองฝั่ง'),
      f('urg', 'ตัวชี้ข้อมูลด่วน', u16(0), '0', 'แทบไม่ถูกใช้ในงานปัจจุบัน'),
    ];
    if (opts.length) fields.push(f('opts', 'ตัวเลือกตอนเริ่มคุย', opts, 'MSS 1460, SACK, Window scale 7', 'ตกลงกันตอนเริ่ม: แพ็กเก็ตละไม่เกิน 1460 ไบต์ของข้อมูล, ตอบรับเฉพาะช่วงที่ได้รับแล้วได้, และขยายขนาดหน้าต่างได้ 128 เท่า'));
    return layer('tcp', 'TCP', 'l4', fields);
  }

  function udpLayer(o, payload) {
    const len = 8 + payload.length;
    const seg = [...u16(o.sport), ...u16(o.dport), ...u16(len), 0, 0, ...payload];
    let ck = csum([...pseudo(o.src, o.dst, 17, len), ...seg]);
    if (ck === 0) ck = 0xffff;
    return layer('udp', 'UDP', 'l4', [
      f('sport', 'พอร์ตต้นทาง', u16(o.sport), portVal(o.sport), 'พอร์ตของโปรแกรมที่ส่ง ถ้าอยากได้คำตอบ อีกฝั่งจะตอบกลับมาที่พอร์ตนี้'),
      f('dport', 'พอร์ตปลายทาง', u16(o.dport), portVal(o.dport), 'พอร์ตของบริการปลายทาง'),
      f('len', 'ความยาว', u16(len), `${len} ไบต์`, 'รวมส่วนหัว UDP 8 ไบต์กับข้อมูล ส่วนหัวทั้งหมดมีแค่ 4 ค่านี้'),
      f('cksum', 'Checksum', u16(ck), hex(ck, 4), 'ตรวจว่าข้อมูลเสียหายไหม ถ้าเสียก็ทิ้ง โดยไม่แจ้งใครและไม่ส่งซ้ำ'),
    ]);
  }

  function finish(eth, ip, l4, app) { return finishLayers([eth, ip, l4, ...app]); }
  function finishLayers(layers) {
    let off = 0;
    const bytes = [];
    layers.forEach(l => l.fields.forEach(x => {
      x.off = off; off += x.b.length; bytes.push(...x.b); x.layer = l.id;
    }));
    return { layers, bytes };
  }

  /* ประกอบเฟรมเต็ม */
  function tcpFrame(o, app = []) {
    const payload = flat(app);
    const t = tcpLayer(o, payload);
    const ip = ipLayer({ ...o, proto: 6, df: o.df !== false }, flat([t]).length + payload.length);
    return finish(ethLayer(o.ethDst, o.ethSrc), ip, t, app);
  }
  function udpFrame(o, app = []) {
    const payload = flat(app);
    const u = udpLayer(o, payload);
    const ip = ipLayer({ ...o, proto: 17 }, 8 + payload.length);
    return finish(ethLayer(o.ethDst, o.ethSrc), ip, u, app);
  }
  function icmpFrame(o) {
    const raw = [o.type, o.code, 0, 0, ...o.rest, ...o.data];
    const ck = csum(raw);
    const fields = [
      f('type', 'ชนิดข้อความ', [o.type], o.typeName, o.typeDesc),
      f('code', 'รหัสย่อย', [o.code], String(o.code), 'ขยายความชนิดข้อความ ชนิดนี้ใช้ค่า 0'),
      f('cksum', 'Checksum', u16(ck), hex(ck, 4), 'ตรวจความเสียหายของข้อความ ICMP ทั้งก้อน'),
    ];
    fields.push(...o.restFields);
    if (o.data.length) fields.push(f('data', o.dataName, o.data, o.dataVal, o.dataDesc));
    const l = layer('icmp', 'ICMP', 'l3', fields);
    const ip = ipLayer({ ...o, proto: 1 }, raw.length);
    return finish(ethLayer(o.ethDst, o.ethSrc), ip, l, []);
  }

  function arpFrame(o) {
    const isReq = o.op === 1;
    return finishLayers([ethLayer(o.ethDst, o.ethSrc, 0x0806), layer('arp', 'ARP', 'l2', [
      f('htype', 'ชนิดฮาร์ดแวร์', u16(1), '1 (Ethernet)', 'ที่อยู่ฮาร์ดแวร์ที่ถามถึงเป็นแบบ Ethernet'),
      f('ptype', 'ชนิดที่อยู่โปรโตคอล', u16(0x0800), '0x0800 (IPv4)', 'ที่อยู่ที่ใช้ถามเป็น IPv4'),
      f('hlen', 'ความยาว MAC', [6], '6 ไบต์', 'ที่อยู่ MAC ยาว 6 ไบต์'),
      f('plen', 'ความยาว IP', [4], '4 ไบต์', 'ที่อยู่ IPv4 ยาว 4 ไบต์'),
      f('op', 'ชนิดข้อความ', u16(o.op), isReq ? '1 (ถาม)' : '2 (ตอบ)', 'บอกว่าข้อความนี้เป็นคำถามหรือคำตอบ'),
      f('sha', 'MAC ของผู้ส่ง', macb(o.sha), macVal(o.sha), 'ผู้รับจำค่านี้ไว้ จะได้ส่งกลับถูกเครื่อง'),
      f('spa', 'IP ของผู้ส่ง', ipb(o.spa), o.spa, 'IP ที่คู่กับ MAC ของผู้ส่ง'),
      f('tha', isReq ? 'MAC ที่ต้องการ' : 'MAC ของผู้รับ', macb(o.tha), isReq ? '00:00:00:00:00:00 (ยังไม่รู้)' : macVal(o.tha), isReq ? 'ยังไม่รู้จึงเป็นศูนย์ นี่คือสิ่งที่กำลังถาม' : 'MAC ของเครื่องที่ถามมา'),
      f('tpa', isReq ? 'IP ที่ถามถึง' : 'IP ของผู้รับ', ipb(o.tpa), o.tpa, isReq ? 'เครื่องที่มี IP นี้เท่านั้นที่ควรตอบ' : 'IP ของเครื่องที่ถามมา'),
    ])]);
  }

  /* บทสนทนา TCP: จัดการเลขลำดับและเลขตอบรับให้สอดคล้องกันจริง */
  function tcpConv(o) {
    const st = { cSeq: o.cIsn, sSeq: o.sIsn };
    const size = (flags, app) => flat(app).length + (flags.includes('SYN') ? 1 : 0) + (flags.includes('FIN') ? 1 : 0);
    let idC = o.idBase || 4100, idS = (o.idBase || 4100) + 21000;
    const c = (flags, app = [], x = {}) => {
      const seq = x.seq !== undefined ? x.seq : st.cSeq;
      const ack = flags.includes('ACK') ? (x.ack !== undefined ? x.ack : st.sSeq) : 0;
      const pkt = tcpFrame({
        ethDst: o.ethToServer || MAC.routerLan, ethSrc: o.ethFromClient || MAC.laptop,
        src: o.client, dst: o.server, sport: o.sport, dport: o.dport, ttl: 64, id: idC++,
        seq, ack, flags, win: flags.includes('SYN') ? 64240 : 501, opts: flags.includes('SYN') ? SYN_OPTS : [],
      }, app);
      if (x.seq === undefined) st.cSeq += size(flags, app);
      return pkt;
    };
    const s = (flags, app = [], x = {}) => {
      const seq = x.seq !== undefined ? x.seq : st.sSeq;
      const ack = flags.includes('ACK') ? (x.ack !== undefined ? x.ack : st.cSeq) : 0;
      const pkt = tcpFrame({
        ethDst: o.ethFromClient || MAC.laptop, ethSrc: o.ethToServer || MAC.routerLan,
        src: o.server, dst: o.client, sport: o.dport, dport: o.sport, ttl: 52, id: idS++,
        seq, ack, flags, win: flags.includes('SYN') ? 65535 : 2048, opts: flags.includes('SYN') ? SYN_OPTS : [],
      }, app);
      if (x.seq === undefined) st.sSeq += size(flags, app);
      return pkt;
    };
    const open = () => { c(['SYN']); s(['SYN', 'ACK']); c(['ACK']); };
    return { c, s, open, st };
  }

  /* โปรโตคอลแบบข้อความ */
  function textLayer(id, label, lines, tone = 'l7') {
    return layer(id, label, tone, lines.map((ln, i) => {
      const [t, d, key, raw] = ln;
      const shown = t === '' ? '(บรรทัดว่าง)' : t;
      return f(key || `ln${i}`, shown.length > 34 ? shown.slice(0, 32) + '…' : shown, enc(raw ? t : t + '\r\n'), shown, d);
    }));
  }

  /* DNS พร้อมการบีบอัดชื่อ */
  const DNS_T = { 1: 'A', 2: 'NS' };
  function dnsLayer(m) {
    const fields = [];
    const table = {};
    let pos = 12;
    const name = n => {
      const out = [];
      const parts = n === '.' ? [] : n.split('.');
      for (let i = 0; i < parts.length; i++) {
        const sfx = parts.slice(i).join('.');
        if (table[sfx] !== undefined) { out.push(...u16(0xc000 | table[sfx])); return out; }
        table[sfx] = pos + out.length;
        const lab = enc(parts[i]);
        out.push(lab.length, ...lab);
      }
      out.push(0);
      return out;
    };
    const flagsWord = (m.qr << 15) | (m.aa << 10) | (m.rd << 8) | (m.ra << 7) | 0;
    const counts = [1, m.an.length, m.ns.length, m.ar.length];
    fields.push(
      f('id', 'หมายเลขคำถาม', u16(m.id), hex(m.id, 4), 'ค่าสุ่มที่คำตอบต้องส่งกลับมาให้ตรงกัน ผู้ถามจึงจับคู่คำถามกับคำตอบได้'),
      f('flags', 'แฟล็ก', u16(flagsWord), m.flagsVal, 'บอกว่านี่คือคำถามหรือคำตอบ และบอกวิธีค้นหาที่ต้องการ',
        [{ n: 'QR คำตอบ', b: String(m.qr), on: !!m.qr }, { n: 'Opcode', b: '0000', v: 'ค้นหาปกติ' }, { n: 'AA ผู้รู้จริง', b: String(m.aa), on: !!m.aa }, { n: 'TC ถูกตัดทอน', b: '0' }, { n: 'RD ช่วยค้นให้', b: String(m.rd), on: !!m.rd }, { n: 'RA ค้นให้ได้', b: String(m.ra), on: !!m.ra }, { n: 'สงวนไว้', b: '000' }, { n: 'RCODE', b: '0000', v: 'ไม่มีข้อผิดพลาด' }]),
      f('qd', 'จำนวนคำถาม', u16(counts[0]), String(counts[0]), 'จำนวนรายการในส่วนคำถาม'),
      f('an', 'จำนวนคำตอบ', u16(counts[1]), String(counts[1]), 'จำนวนระเบียนที่ตอบคำถามนี้โดยตรง'),
      f('nsc', 'จำนวนผู้รับผิดชอบ', u16(counts[2]), String(counts[2]), 'จำนวนระเบียนที่บอกว่าควรไปถามเซิร์ฟเวอร์ใดต่อ'),
      f('ar', 'จำนวนข้อมูลเสริม', u16(counts[3]), String(counts[3]), 'จำนวนระเบียนเสริม เช่น IP ของเซิร์ฟเวอร์ที่แนะนำให้ไปถาม'),
    );
    const push = x => { fields.push(x); pos += x.b.length; };
    const qn = name(m.q);
    push(f('qname', 'ชื่อที่ถาม', qn, m.q, 'เก็บเป็นส่วนๆ โดยมีเลขความยาวนำหน้าแต่ละส่วน และปิดท้ายด้วย 0'));
    push(f('qtype', 'ชนิดที่ถาม', u16(1), '1 (A: ที่อยู่ IPv4)', 'A คือการถามหาที่อยู่ IPv4 ของชื่อนี้'));
    push(f('qclass', 'คลาส', u16(1), '1 (IN: อินเทอร์เน็ต)', 'คลาส IN ใช้กับอินเทอร์เน็ตแทบทุกกรณี'));
    const rr = (r, tag, title) => {
      const nb = name(r.name);
      push(f(`${tag}name`, `${title}: ชื่อ`, nb, r.name, nb.length === 2 ? 'ใช้ตัวชี้ย้อนไปยังชื่อที่เขียนไว้แล้ว ช่วยให้แพ็กเก็ตสั้นลง' : 'ชื่อที่ระเบียนนี้พูดถึง'));
      push(f(`${tag}type`, `${title}: ชนิด`, u16(r.type), `${r.type} (${DNS_T[r.type]})`, r.type === 1 ? 'A คือระเบียนที่อยู่ IPv4' : 'NS บอกชื่อเซิร์ฟเวอร์ที่ดูแลโดเมนนี้'));
      push(f(`${tag}class`, `${title}: คลาส`, u16(1), '1 (IN)', 'คลาสอินเทอร์เน็ต'));
      push(f(`${tag}ttl`, `${title}: อายุแคช`, u32(r.ttl), `${r.ttl} วินาที`, 'จำคำตอบนี้ไว้ได้นานเท่านี้ ก่อนต้องถามใหม่'));
      push(f(`${tag}rdlen`, `${title}: ความยาวข้อมูล`, [0, 0], '', 'จำนวนไบต์ของข้อมูลระเบียน'));
      const lenField = fields[fields.length - 1];
      let data;
      if (r.type === 1) data = ipb(r.data); else data = name(r.data);
      lenField.b = u16(data.length); lenField.val = `${data.length} ไบต์`;
      push(f(`${tag}data`, `${title}: ข้อมูล`, data, r.data, r.type === 1 ? 'ที่อยู่ IPv4 ที่ผู้ถามต้องการ' : 'ชื่อของเซิร์ฟเวอร์ที่ควรไปถามต่อ'));
    };
    m.an.forEach((r, i) => rr(r, `an${i}`, 'คำตอบ'));
    m.ns.forEach((r, i) => rr(r, `ns${i}`, 'ผู้รับผิดชอบ'));
    m.ar.forEach((r, i) => rr(r, `ar${i}`, 'ข้อมูลเสริม'));
    return layer('dns', 'DNS', 'l7', fields);
  }

  /* DHCP */
  function dhcpLayer(o) {
    const mac = macb(MAC.laptop);
    const opt = (key, name, code, data, val, desc) => f(key, name, [code, data.length, ...data], val, desc);
    const fields = [
      f('op', 'ทิศทาง', [o.op], o.op === 1 ? '1 (คำขอจากไคลเอนต์)' : '2 (คำตอบจากเซิร์ฟเวอร์)', 'บอกว่าข้อความนี้เป็นคำขอหรือคำตอบ'),

      f('hlen', 'ความยาว MAC', [6], '6 ไบต์', 'ความยาวของที่อยู่ฮาร์ดแวร์'),

      f('secs', 'เวลาที่รอมาแล้ว', u16(0), '0 วินาที', 'เวลาที่ไคลเอนต์เริ่มขอที่อยู่มาแล้ว'),
      f('bflags', 'แฟล็ก', u16(0x8000), 'ตอบแบบกระจาย', 'ขอให้ตอบเป็น broadcast เพราะเครื่องยังไม่มี IP ของตัวเอง',
        [{ n: 'ตอบแบบกระจาย', b: '1', on: true }, { n: 'สงวนไว้', b: bin(0, 15) }]),

      f('giaddr', 'IP ตัวส่งต่อ', ipb('0.0.0.0'), '0.0.0.0', 'ไม่มีตัวส่งต่อในเครือข่ายบ้าน'),
      f('chaddr', 'MAC ของไคลเอนต์', [...mac, ...zeros(10)], MAC.laptop, 'เซิร์ฟเวอร์ใช้ค่านี้รู้ว่ากำลังตอบใคร ช่องนี้มี 16 ไบต์แต่ใช้จริงแค่ 6'),
      f('sname', 'ชื่อเซิร์ฟเวอร์', zeros(64), 'ว่าง', 'ช่องเก่าจากโปรโตคอล BOOTP ปัจจุบันมักว่าง'),
      f('file', 'ไฟล์บูต', zeros(128), 'ว่าง', 'ช่องเก่าจาก BOOTP ใช้กับการบูตผ่านเครือข่าย'),
      f('magic', 'Magic cookie', [99, 130, 83, 99], '99.130.83.99', 'ค่าคงที่ที่บอกว่าต่อจากนี้คือตัวเลือกของ DHCP'),

      if (o.reqIp) fields.push(opt('reqip', 'IP ที่ขอ', 50, ipb(o.reqIp), o.reqIp, 'แล็ปท็อปยืนยันว่าเลือกที่อยู่นี้'));
      if (o.server) fields.push(opt('serverid', 'เซิร์ฟเวอร์ที่เลือก', 54, ipb(o.server), o.server, 'บอกทุกเครื่องในวงว่าเลือกข้อเสนอจากเซิร์ฟเวอร์ไหน'));
      fields.push(opt('hostname', 'ชื่อเครื่อง', 12, enc('laptop'), 'laptop', 'ชื่อที่แล็ปท็อปแจ้งเราเตอร์'));
      fields.push(opt('prl', 'ขอข้อมูลเพิ่ม', 55, [1, 3, 6], 'Subnet mask, Router, DNS', 'รายการค่าตั้งเครือข่ายอื่นๆ ที่แล็ปท็อปต้องการ'));
    } else {

      fields.push(opt('lease', 'เวลาเช่าที่อยู่', 51, u32(86400), '86400 วินาที (1 วัน)', 'ใช้ที่อยู่นี้ได้ 1 วัน ก่อนหมดเวลาต้องขอต่ออายุ'));

    }
    fields.push(f('end', 'จบตัวเลือก', [255], '255', 'บอกว่าตัวเลือกหมดแล้ว'));
    return layer('dhcp', 'DHCP', 'l7', fields);
  }

  /* NTP */
  function ntpStamp(ms) {
    const unix = Math.floor(ms / 1000);
    const frac = Math.floor(((ms % 1000) / 1000) * 4294967296);
    return [...u32(unix + 2208988800), ...u32(frac)];
  }
  const when = ms => new Date(ms).toISOString().replace('T', ' ').replace(/\.(\d{3})Z/, '.$1 UTC');
  function ntpLayer(o) {
    const first = (0 << 6) | (4 << 3) | o.mode;
    return layer('ntp', 'NTP', 'l7', [
      f('flags', 'เวอร์ชันและบทบาท', [first], o.mode === 3 ? 'เวอร์ชัน 4, ไคลเอนต์' : 'เวอร์ชัน 4, เซิร์ฟเวอร์', 'ไบต์เดียวบอกทั้งการแจ้งเตือนวินาทีอธิกสุรทิน เวอร์ชัน และบทบาทของผู้ส่ง',
        [{ n: 'แจ้งเตือน', b: '00', v: 'ไม่มี' }, { n: 'เวอร์ชัน', b: '100', v: '4' }, { n: 'บทบาท', b: bin(o.mode, 3), v: o.mode === 3 ? 'ไคลเอนต์' : 'เซิร์ฟเวอร์' }]),
      f('stratum', 'ระดับนาฬิกา', [o.stratum], o.stratum ? `ระดับ ${o.stratum}` : 'ไม่ระบุ', 'ระยะห่างจากนาฬิกาอ้างอิง เลขน้อยแปลว่าใกล้แหล่งเวลาหลักกว่า'),
      f('poll', 'รอบการถาม', [6], '64 วินาที', 'ช่วงเวลาระหว่างการถามแต่ละครั้ง เก็บเป็นเลขยกกำลังสอง'),
      f('prec', 'ความละเอียดนาฬิกา', [0xec], 'ประมาณ 1 ไมโครวินาที', 'ความละเอียดของนาฬิกาผู้ส่ง เก็บเป็นเลขยกกำลังสองติดลบ'),
      f('delay', 'หน่วงถึงต้นทางเวลา', o.mode === 3 ? zeros(4) : [0, 0, 0, 0x12], o.mode === 3 ? '0' : 'น้อยกว่า 1 มิลลิวินาที', 'เวลาเดินทางไปกลับถึงนาฬิกาอ้างอิง'),
      f('disp', 'ความคลาดเคลื่อนสะสม', o.mode === 3 ? zeros(4) : [0, 0, 0, 0x20], o.mode === 3 ? '0' : 'น้อยกว่า 1 มิลลิวินาที', 'ประมาณความคลาดเคลื่อนเทียบกับนาฬิกาอ้างอิง'),
      f('ref', 'แหล่งเวลาอ้างอิง', o.mode === 3 ? zeros(4) : ipb('198.51.100.1'), o.mode === 3 ? 'ไม่มี' : '198.51.100.1', 'เซิร์ฟเวอร์ต้นทางที่นาฬิกานี้ไปตั้งเวลาตาม'),
      f('refts', 'ตั้งเวลาล่าสุดเมื่อ', o.refTs ? ntpStamp(o.refTs) : zeros(8), o.refTs ? when(o.refTs) : 'ไม่มี', 'เวลาล่าสุดที่นาฬิกาเซิร์ฟเวอร์ถูกปรับ'),
      f('orgts', 'เวลาที่ไคลเอนต์ส่ง', o.org ? ntpStamp(o.org) : zeros(8), o.org ? when(o.org) : 'ไม่มี', 'เซิร์ฟเวอร์ลอกจากคำขอกลับมา ทำให้ไคลเอนต์คำนวณเวลาเดินทางได้'),
      f('rxts', 'เวลาที่เซิร์ฟเวอร์รับ', o.rx ? ntpStamp(o.rx) : zeros(8), o.rx ? when(o.rx) : 'ไม่มี', 'เวลาที่คำขอถึงเซิร์ฟเวอร์'),
      f('txts', 'เวลาที่ส่งข้อความนี้', ntpStamp(o.tx), when(o.tx), 'เวลาที่ข้อความนี้ออกจากผู้ส่ง'),
    ]);
  }

  /* TLS */
  const sec = (name, b, val, desc, key) => f(key, name, b, val, desc);
  function ext(type, body) { return [...u16(type), ...u16(body.length), ...body]; }
  function clientHello(host, seed) {
    const random = rnd(32, seed + 'cr');
    const sid = rnd(32, seed + 'sid');
    const suites = [0x13, 0x01, 0x13, 0x02, 0x13, 0x03];
    const hb = enc(host);

  /* ---------- ICMP ---------- */
  function icmp() {
    const payload = enc('abcdefghijklmnopqrstuvwabcdefghi');
    const echoFields = (id, seq) => [
      f('icmpid', 'หมายเลขชุด', u16(id), String(id), 'โปรแกรม ping ใช้ค่านี้แยกคำตอบของตัวเองจากโปรแกรมอื่น'),
      f('icmpseq', 'ลำดับ', u16(seq), String(seq), 'เลขลำดับของ ping แต่ละครั้ง ใช้ดูว่าครั้งไหนหาย'),
    ];
    const echo = (o) => icmpFrame({
      ...o, code: 0, rest: [...u16(o.icmpId), ...u16(o.seq)], restFields: echoFields(o.icmpId, o.seq), data: payload,
      dataName: 'ข้อมูลทดสอบ', dataVal: 'abcdefgh… 32 ไบต์', dataDesc: 'ข้อมูลอะไรก็ได้ ปลายทางต้องส่งกลับมาเหมือนเดิมทุกไบต์',
    });
    const req = (ttl, seq, id, src = LAPTOP) => echo({ ethDst: MAC.routerLan, ethSrc: MAC.laptop, src, dst: WEB, ttl, id, type: 8, typeName: '8 (Echo Request)', typeDesc: 'ขอให้ปลายทางตอบกลับ คือสิ่งที่คำสั่ง ping ส่งออกไป', icmpId: 1, seq });
    const exceeded = (from, ttl, id, orig) => {
      const quoted = orig.bytes.slice(14, 14 + 28);
      return icmpFrame({
        ethDst: MAC.laptop, ethSrc: MAC.routerLan, src: from, dst: LAPTOP, ttl, id, type: 11, code: 0,
        typeName: '11 (Time Exceeded)', typeDesc: 'แจ้งว่า TTL หมดระหว่างทาง แพ็กเก็ตนั้นถูกทิ้งแล้ว',
        rest: [0, 0, 0, 0], restFields: [f('unused', 'ช่องที่ไม่ใช้', [0, 0, 0, 0], '0', 'ข้อความชนิดนี้ไม่ใช้ 4 ไบต์นี้')],
        data: quoted, dataName: 'ส่วนต้นของแพ็กเก็ตที่ถูกทิ้ง', dataVal: 'ส่วนหัว IP และ 8 ไบต์แรก', dataDesc: 'แนบส่วนต้นของแพ็กเก็ตเดิมมา แล็ปท็อปจึงรู้ว่าข้อความนี้เกี่ยวกับแพ็กเก็ตไหน',
      });
    };
    const r1 = req(1, 2, 5001), r2 = req(2, 3, 5002);
    const q2 = req(1, 3, 5002); /* สำเนาตามที่เราเตอร์ ISP เห็น TTL เหลือ 1 */
    return {
      id: 'icmp', group: 'ต่อเน็ตและหาทาง', name: 'ICMP', full: 'ping และ traceroute', accent: 'l4',
      intro: 'ICMP คือข้อความแจ้งสถานะของเครือข่ายเอง ไม่ได้ขนข้อมูลของแอป เครื่องมือ ping และ traceroute ที่ช่างเน็ตใช้ก็ทำงานด้วยข้อความเหล่านี้',
      keep: 'ping วัดว่าปลายทางตอบไหมและใช้เวลาเท่าไร ส่วน traceroute ตั้ง TTL ทีละน้อยเพื่อบังคับให้เราเตอร์แต่ละตัวบอกตัวตน',
      labels: { internet: { name: 'เราเตอร์ของ ISP', short: 'ISP', ip: '198.51.100.1' } },
      steps: [
        { from: 'laptop', to: 'web', tag: 'ping', title: 'ping: ส่ง Echo Request', text: 'คำสั่ง ping ส่งข้อความนี้ไปที่ปลายทางแล้วเริ่มจับเวลา ส่งตรงบน IP โดยไม่ต้องใช้ TCP หรือ UDP', focus: 'type',

  /* ---------- TCP ---------- */
  function tcp() {
    const s = tcpConv({ client: LAPTOP, server: WEB, sport: 51520, dport: 80, cIsn: 2000000, sIsn: 7000000, idBase: 4300 });
    const data = (t, d) => layer('data', 'ข้อมูลแอป', 'l7', [f('data', 'ข้อมูล', enc(t), t.trim(), d || 'เนื้อหาของแอป TCP มองเป็นแค่ลำดับไบต์ ไม่สนว่าข้างในคืออะไร')]);
    const a = data('Part one of the file.\n'), b = data('Part two of the file.\n'), c = data('Part three, the last.\n');
    const steps = [];
    const syn = s.c(['SYN']);
    const synack = s.s(['SYN', 'ACK']);
    const ack = s.c(['ACK']);
    const pa = s.c(['ACK', 'PSH'], [a]);
    const ackA = s.s(['ACK']);
    const bSeq = s.st.cSeq;
    const pb = s.c(['ACK', 'PSH'], [b]);
    const afterB = s.st.cSeq;
    const pc = s.c(['ACK', 'PSH'], [c]);
    const dup = s.s(['ACK'], [], { ack: bSeq });
    const retr = s.c(['ACK', 'PSH'], [b], { seq: bSeq });
    const ackAll = s.s(['ACK']);
    void afterB;
    const fin1 = s.c(['FIN', 'ACK']);
    const fin2 = s.s(['FIN', 'ACK']);
    const fin3 = s.c(['ACK']);
    steps.push(
      { from: 'laptop', to: 'web', tag: 'SYN', title: 'SYN: ขอเริ่มคุย', text: 'แล็ปท็อปเลือกเลขลำดับเริ่มต้นและขอเปิดการเชื่อมต่อ อินเทอร์เน็ตส่งของได้ไม่รับประกัน TCP จึงต้องตกลงตำแหน่งเริ่มนับกันก่อน', focus: 'flags', pkt: syn },
      { from: 'web', to: 'laptop', tag: 'SYN-ACK', title: 'SYN-ACK: รับทราบและขอเริ่มเหมือนกัน', text: 'เซิร์ฟเวอร์ตอบว่าเลขตอบรับคือเลขลำดับของแล็ปท็อปบวก 1 และส่งเลขลำดับของตัวเองมาด้วย การคุยจึงนับแยกกันสองทิศ', focus: 'ack', pkt: synack },
      { from: 'laptop', to: 'web', tag: 'ACK', title: 'ACK: จับมือครบสามขั้น', text: 'แล็ปท็อปยืนยันเลขของเซิร์ฟเวอร์ จากนี้สองฝั่งพร้อมส่งข้อมูล', focus: 'ack', pkt: ack },
      { from: 'laptop', to: 'web', tag: 'ส่วน 1', title: 'ส่งข้อมูลส่วนแรก', text: 'ข้อมูลนี้ยาว 22 ไบต์ เลขลำดับของส่วนถัดไปจึงเพิ่มขึ้นอีก 22', focus: 'seq', pkt: pa },
      { from: 'web', to: 'laptop', tag: 'ACK', title: 'ตอบรับส่วนแรก', text: 'เลขตอบรับขยับไปเท่ากับไบต์ถัดไปที่เซิร์ฟเวอร์รออยู่ ถ้าแล็ปท็อปเห็นค่านี้ก็รู้ว่าส่วนแรกถึงแล้ว', focus: 'ack', pkt: ackA },
      { from: 'laptop', to: 'web', tag: 'ส่วน 2', title: 'ส่วนที่สองหายระหว่างทาง', text: 'แพ็กเก็ตหายได้เสมอ เช่น เมื่อเราเตอร์รับไม่ทันจนต้องทิ้ง ตอนนี้ยังไม่มีใครรู้ว่าส่วนนี้หายไป', focus: 'seq', lost: true, pkt: pb },
      { from: 'laptop', to: 'web', tag: 'ส่วน 3', title: 'ส่วนที่สามไปถึงก่อน', text: 'เซิร์ฟเวอร์ดูเลขลำดับแล้วรู้ว่ามีช่องว่าง เพราะกำลังรอไบต์ที่มาก่อนหน้านี้ มันจึงเก็บส่วนนี้ไว้ก่อน แต่ยังไม่ส่งให้แอป', focus: 'seq', pkt: pc },
      { from: 'web', to: 'laptop', tag: 'ACK ซ้ำ', title: 'ตอบรับเลขเดิมซ้ำ', text: 'เลขตอบรับไม่ขยับ แปลว่าเซิร์ฟเวอร์ยังรอไบต์ตำแหน่งเดิม นี่เป็นสัญญาณให้แล็ปท็อปรู้ว่าอาจมีแพ็กเก็ตหาย', focus: 'ack', pkt: dup },

      { from: 'laptop', to: 'web', tag: 'FIN', title: 'FIN: แล็ปท็อปขอจบ', text: 'แล็ปท็อปไม่มีอะไรจะส่งแล้ว แต่ยังรับข้อมูลได้จนกว่าเซิร์ฟเวอร์จะปิดฝั่งของตัวเอง', focus: 'flags', pkt: fin1 },
      { from: 'web', to: 'laptop', tag: 'FIN-ACK', title: 'เซิร์ฟเวอร์ตอบรับและขอจบด้วย', text: 'เซิร์ฟเวอร์ไม่มีข้อมูลค้างส่งเช่นกัน จึงรวมการตอบรับกับ FIN ไว้ในแพ็กเก็ตเดียว', focus: 'flags', pkt: fin2 },
      { from: 'laptop', to: 'web', tag: 'ACK', title: 'ปิดการเชื่อมต่อเรียบร้อย', text: 'ACK สุดท้ายยืนยันการจบ ทั้งสองฝั่งคืนทรัพยากรของการเชื่อมต่อนี้', focus: 'ack', pkt: fin3 },
    );
    return {
      id: 'tcp', group: 'ส่งข้อมูล', name: 'TCP', full: 'ส่งให้ครบและเรียงลำดับ', accent: 'l4',
      intro: 'IP ส่งแพ็กเก็ตแบบไม่รับประกัน อาจหาย ซ้ำ หรือสลับลำดับได้ TCP แก้ปัญหานี้ด้วยการนับทุกไบต์ ตอบรับสิ่งที่ได้ และส่งซ้ำสิ่งที่หาย',

  /* จัดวางการ์ดอัตโนมัติจากอุปกรณ์ที่ใช้จริงในบท */
  function layoutFlow(mode, used) {
    const pos = {}, zones = [], srv = SERVERS.filter(n => used.has(n));
    const home = HOME.filter(n => used.has(n)), hasNet = used.has('internet');
    if (mode === 'v') {

    const small = layName !== 'h';
    for (const id in FLOW.pos) {

      } else {
        const pad = small ? 8 : 10, c = small ? 30 : 40, tx = x0 + pad + c + 7, room = P.w - (pad + c + 7) - pad, sc = c / 24 * .66, off = (c - 24 * sc) / 2;
        inner = `<g transform="translate(${x0 + pad} ${-c / 2})"><rect class="chip" width="${c}" height="${c}" rx="${small ? 9 : 11}" fill="${CHIP[ic]}"/><path class="gl" transform="translate(${off} ${off}) scale(${sc})" d="${GLYPH[ic]}"/></g><text class="nm${small ? ' nm-c' : ''}" x="${tx}" y="${n.ip ? -2 : 5}" data-room="${room}" data-short="${esc(n.short)}">${esc(n.name)}</text><text class="ipt${small ? ' ipt-c' : ''}" x="${tx}" y="${small ? 13 : 15}">${esc(n.ip)}</text>`;

  }

  const ADJ = { laptop: ['router'], router: ['laptop', 'internet'], internet: ['router', 'dns', 'web', 'mail', 'files'], dns: ['internet'], web: ['internet'], mail: ['internet'], files: ['internet'] };
  function routeOf(a, b) {
    const q = [[a]]; const seen = new Set([a]);
    while (q.length) {
      const p = q.shift(); const last = p[p.length - 1];
      if (last === b) return p;
      for (const n of ADJ[last]) if (!seen.has(n)) { seen.add(n); q.push([...p, n]); }
    }
    return [a];
  }

  /* ---------- สถานะ ---------- */
  const S = { l: 0, s: 0, layer: null, field: null, hover: null, playing: false, raf: 0, timer: 0, bytesPerRow: 16, cat: 'all', vtab: 'net', insp: false, ov: true, vb: [0, 0], present: false, pview: 'map', find: null, listLayer: null, skipListScroll: false, parentUrl: '' };
  const lesson = () => LESSONS[S.l];
  const step = () => lesson().steps[S.s];
  const allFields = p => p.layers.flatMap(l => l.fields);
  const speed = () => Number($('#speed').value) || 1;

  function setUrl() {
    const hash = S.ov ? lesson().id : `${lesson().id}/${S.s + 1}`;
    try { history.replaceState(null, '', `#${hash}`); } catch (e) { /* หน้าอาจอยู่ใน sandbox */ }
    if (window.parent !== window) { try { window.parent.postMessage({ type: 'protocol-explorer:location', hash }, '*'); } catch (e) { /* ไม่มีหน้าแม่ */ } }
  }

  function go(l, s, animate, ov = false) {
    const changedLesson = l !== S.l;
    S.l = l; S.s = s; S.ov = ov;
    if (changedLesson || !layName) { stopPlay(); drawRail(); drawMap(); renderLesson(); }
    renderStep(animate);
    setUrl();
  }

  /* ---------- ข้อมูลแพ็กเก็ตสำหรับตาราง ---------- */
  const fieldOf = (pk, id, key) => { const l = pk.layers.find(y => y.id === id); return l && l.fields.find(x => x.key === key); };
  const firstTok = v => String(v).split(' ')[0];
  function addrOf(pk) {
    const s = fieldOf(pk, 'ip', 'srcip'), d = fieldOf(pk, 'ip', 'dstip');
    if (s) return [s.val, d.val];
    const e = firstTok(fieldOf(pk, 'eth', 'dst').val);
    return [firstTok(fieldOf(pk, 'eth', 'src').val), e === 'ff:ff:ff:ff:ff:ff' ? 'Broadcast' : e];
  }
  function protoOf(pk) {
    const t = pk.layers[pk.layers.length - 1];
    if (t.id === 'data') return 'TCP';
    if (t.id === 'ftp-data') return 'FTP-DATA';
    return t.label === 'IPv4' ? 'IP' : t.label;
  }
  function infoOf(pk) {
    const t = pk.layers[pk.layers.length - 1], val = k => { const x = t.fields.find(y => y.key === k); return x ? x.val : ''; };
    switch (t.id) {
      case 'arp': return val('op').startsWith('1') ? `Who has ${val('tpa')}? Tell ${val('spa')}` : `${val('spa')} is at ${firstTok(val('sha'))}`;
      case 'dhcp': return `DHCP ${val('msgtype').replace(/^\d+ \((.*)\)$/, '$1')}`;
      case 'dns': {
        const q = val('qname');
        if (fieldOf(pk, 'dns', 'flags').b[0] < 128) return `Standard query A ${q}`;
        if (t.fields.some(x => x.key === 'an0data')) return `Standard query response A ${val('an0data')}`;
        return `Standard query response, NS ${val('ns0data')}`;
      }
      case 'ntp': return t.fields[0].b[0] % 8 === 3 ? 'NTP version 4, client' : 'NTP version 4, server';
      case 'icmp': {
        const ty = t.fields.find(y => y.key === 'type').b[0], ttl = fieldOf(pk, 'ip', 'ttl').b[0];
        if (ty === 11) return 'Time-to-live exceeded';
        const sq = t.fields.find(y => y.key === 'icmpseq');
        return `Echo (ping) ${ty === 8 ? 'request' : 'reply'}, seq=${sq.val}, ttl=${ttl}`;
      }
      case 'tls': {
        const hs = val('hstype');
        if (hs.includes('ClientHello')) return `Client Hello (SNI=${val('sni')})`;
        if (hs.includes('ServerHello')) return 'Server Hello';
        return t.fields[0].b[0] === 20 ? 'Change Cipher Spec, Application Data' : 'Application Data';
      }
      case 'ssh': {
        if (val('banner')) return val('banner');
        if (val('msg')) return `SSH ${val('msg').replace(/^\d+ \((.*)\)$/, '$1')}`;
        return `Encrypted packet (${t.fields.reduce((a, x) => a + x.b.length, 0)} bytes)`;
      }
      case 'http': case 'smtp': case 'pop3': case 'imap': case 'ftp': return t.fields[0].val;
      case 'ftp-data': return `FTP data: ${t.fields[0].b.length} bytes`;
      default: {
        const l = pk.layers.find(y => y.id === 'tcp');
        if (!l) return t.label;
        const f = n => l.fields.find(y => y.key === n);
        const size = pk.layers.slice(pk.layers.indexOf(l) + 1).reduce((a, y) => a + y.fields.reduce((c, x) => c + x.b.length, 0), 0);
        const num = x => x.b.reduce((a, v) => a * 256 + v, 0);
        const on = f('flags').val.split(', ');
        const flags = ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG'].filter(n => on.includes(n)).join(', ');
        return `${num(f('sport'))} → ${num(f('dport'))} [${flags}] Seq=${num(f('seq')) % 10000}${f('flags').val.includes('ACK') ? ` Ack=${num(f('ack')) % 10000}` : ''} Len=${size}`;
      }
    }
  }
  const ORDER = ['laptop', 'router', 'internet', 'dns', 'web', 'mail', 'files'];
  const dirOf = st => (st.lost ? 'lost' : ORDER.indexOf(st.to) > ORDER.indexOf(st.from) ? 'out' : 'back');
  /* เวลาในตารางเป็นตัวอย่าง: คิดจากระยะทางบนแผนภาพ */
  function timesOf(L) {
    let t = 0;
    return L.steps.map((st, i) => {
      if (i > 0) { const p = L.steps[i - 1]; t += (routeOf(p.from, p.to).includes('internet') ? 0.012 : 0.002) + 0.001; }
      return t;
    });
  }
  const reach = () => (S.ov ? lesson().steps.length - 1 : Math.max(S.s, prog[lesson().id] === undefined ? 0 : prog[lesson().id]));

  function renderLesson() {
    const L = lesson();

      if (st.skip) { const sk = el('tr', { class: 'row-skip', 'data-after': i }); sk.append(el('td', { colspan: '7', text: `ขั้นตอนที่ย่อไว้: ${st.skip}` })); body.append(sk); }
      const tr = el('tr', { class: `row-p tone-${tone}`, 'data-i': i });
      tr.innerHTML = `<td><button type="button" class="fn d-${dirOf(st)}" aria-label="ขั้น ${i + 1}">${i + 1}</button></td><td class="c-time">${times[i].toFixed(3)}s</td><td class="c-src">${esc(src)}</td><td class="c-dst">${esc(dst)}</td><td class="c-proto">${esc(protoOf(st.pkt))}</td><td class="c-info">${esc(infoOf(st.pkt))}${st.lost ? ' (หายระหว่างทาง)' : ''}<span class="route-s">${esc(labels[st.from].short)} ไป ${esc(labels[st.to].short)}</span></td><td class="c-size">${st.pkt.bytes.length} B</td>`;
      body.append(tr);
    });
    document.title = `${L.name}: ${L.full}`;
  }

  /* ---------- มุมมองลำดับแพ็กเก็ต ---------- */
  function setTab(t) {

  function drawSeq() {
    const box = $('#seq');
    if (S.vtab !== 'seq') return;
    const L = lesson(), labels = Object.assign({}, DEF, L.labels || {});
    const lanes = ORDER.filter(n => L.steps.some(st => st.from === n || st.to === n));
    const W = Math.max(300, box.clientWidth || 600), small = W < 560;
    const padL = small ? 46 : 74, padR = small ? 40 : 74, rowH = 44;
    const x = n => padL + (W - padL - padR) * lanes.indexOf(n) / Math.max(1, lanes.length - 1);
    const dH = 24, yOf = [], skips = [];
    let cursor = 0;
    const dividers = [];
    L.steps.forEach((st, i) => {
      const ci = L.chapters.findIndex(c => c[0] === i);
      if (ci >= 0) { dividers.push([ci, cursor]); cursor += dH; }
      if (st.skip) { skips.push([i, st.skip, cursor]); cursor += 20; }
      yOf.push(cursor); cursor += rowH;
    });
    const H = cursor + 8;
    let head = '', h = '';
    lanes.forEach(n => {
      head += `<text class="sq-h" x="${x(n)}" y="16" text-anchor="middle">${esc(small || lanes.length > 3 ? labels[n].short : labels[n].name)}</text>`;
      if (!small) head += `<text class="sq-ip" x="${x(n)}" y="31" text-anchor="middle">${esc(n === 'laptop' && step().noIp ? 'ยังไม่มี IP' : labels[n].ip)}</text>`;
      head += `<line class="sq-lane" x1="${x(n)}" y1="36" x2="${x(n)}" y2="42"/>`;
      h += `<line class="sq-lane" x1="${x(n)}" y1="0" x2="${x(n)}" y2="${H}"/>`;
    });
    skips.forEach(([i, t, y]) => { if (i <= reach()) h += `<text class="sq-skip" x="${W / 2}" y="${y + 14}" text-anchor="middle">ย่อไว้: ${esc(t)}</text>`; });
    dividers.forEach(([ci, y]) => { h += `<line class="sq-div" x1="0" y1="${y + 20}" x2="${W}" y2="${y + 20}"/><text class="sq-dt" x="2" y="${y + 15}">ขั้น ${ci + 1}: ${esc(L.chapters[ci][1])}</text>`; });
    L.steps.forEach((st, i) => {
      if (i > reach()) return;
      const y = yOf[i] + 28, a = x(st.from), b = x(st.to), dir = b > a ? 1 : -1;
      const end = st.lost ? a + (b - a) * .55 : b, tone = st.lock ? 'sec' : st.pkt.layers[st.pkt.layers.length - 1].tone;
      const thai = /[฀-๿]/.test(st.tag);
      h += `<g class="sq tone-${tone}${i === S.s && !S.ov ? ' cur' : ''}" data-i="${i}" tabindex="0" role="button" aria-label="ขั้น ${i + 1}: ${esc(st.title)}">`;
      h += `<rect class="hit" x="0" y="${y - 26}" width="${W}" height="${rowH}" rx="3"/><text class="n" x="4" y="${y + 4}">${i + 1}</text>`;
      h += `<text class="t${thai ? ' thai' : ''}" x="${(a + end) / 2}" y="${y - 7}" text-anchor="middle">${esc(st.tag)}</text>`;
      h += `<line x1="${a}" y1="${y}" x2="${end - dir * 6}" y2="${y}"/>`;
      if (st.lost) h += `<path class="x" d="M${end - 6} ${y - 6}l12 12 M${end + 6} ${y - 6}l-12 12"/>`;
      else h += `<polygon points="${end},${y} ${end - dir * 9},${y - 5} ${end - dir * 9},${y + 5}"/>`;
      h += '</g>';
    });
    box.innerHTML = `<svg class="seqh" viewBox="0 0 ${W} 42" height="42" aria-hidden="true">${head}</svg><svg viewBox="0 0 ${W} ${H}" height="${H}" role="group" aria-label="ลำดับแพ็กเก็ตของบท ${esc(L.name)}">${h}</svg>`;
    const y = yOf[S.s] + 42;
    if (y - 42 < box.scrollTop || y + rowH > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, y - box.clientHeight / 2);
  }

  /* ---------- ตัวบอกชั้น OSI ---------- */
  const OSI_NUM = { eth: [2], arp: [2, 3], ip: [3], icmp: [3], tcp: [4], udp: [4], tls: [5, 6] };
  const OSI_LABEL = { 1: 'Physical', 2: 'Data Link', 3: 'Network', 4: 'Transport', 5: 'Session', 6: 'Presentation', 7: 'Application' };
  function drawOsi(st) {
    const on = new Set(), top = OSI_NUM[st.pkt.layers[st.pkt.layers.length - 1].id] || [7];
    st.pkt.layers.forEach(l => (OSI_NUM[l.id] || [7]).forEach(n => on.add(n)));

    $('#osi').className = `tone-${tone}`;
    $('#osi').innerHTML = [7, 6, 5, 4, 3, 2, 1].map(n => `<i class="${top.includes(n) ? 'top1' : on.has(n) ? 'on' : ''}"><b>${n}</b><span>${OSI_LABEL[n]}</span></i>`).join('');

  /* การแสดงผลของตารางเท่านั้น ไม่แตะแบบฝึกหัดหรือแอนิเมชันของขั้นปัจจุบัน */

    $('#ftBody').querySelectorAll('tr[data-i]').forEach(tr => {

    /* ปุ่มที่กดอยู่อาจถูกปิดใช้งาน จึงย้ายโฟกัสไปปุ่มถัดไปที่ใช้ได้ */
    if (active === $('#next') && $('#next').disabled) $('#prev').focus({ preventScroll: true });
    if (active === $('#prev') && S.s === 0) $('#next').focus({ preventScroll: true });
    const tone = st.pkt.layers[st.pkt.layers.length - 1].tone;
    mapEl.setAttribute('class', `tone-${st.lock ? 'sec' : tone}`);
    mapEl.setAttribute('aria-label', `${labels[st.from].name} ส่ง ${st.tag} ไป ${labels[st.to].name}${st.lost ? ' แต่แพ็กเก็ตหายระหว่างทาง' : ''}`);
    mapEl.querySelectorAll('.node').forEach(n => { n.classList.remove('src', 'dst', 'via', 'hit'); const tg = $('.ntag', n); if (tg) tg.style.display = 'none'; });
    if (S.ov) {
      cancelAnimationFrame(S.raf);
      ['#rt', '#rtRest', '#rtFlow'].forEach(q => { const r = $(q); if (r) r.setAttribute('d', ''); });
      ['#tok', '#call', '#rtHead'].forEach(q => { const r = $(q); if (r) r.style.display = 'none'; });
      mapEl.setAttribute('aria-label', `อุปกรณ์ในบท ${L.name}`);
    } else {

  }

  /* ---------- คำศัพท์ในข้อความ ---------- */
  const isWordCh = c => !!c && /[A-Za-z0-9]/.test(c);
  function linkTerms(text) {
    const spans = [];
    [...GLOSSARY].sort((a, b) => b[0].length - a[0].length).forEach(([term]) => {
      const latin = /^[A-Za-z]/.test(term);
      for (let i = text.indexOf(term); i >= 0; i = text.indexOf(term, i + 1)) {
        if (latin && (isWordCh(text[i - 1]) || isWordCh(text[i + term.length]))) continue;
        const end = i + term.length;
        if (!spans.some(s => i < s.end && end > s.start)) spans.push({ start: i, end, term });
        break;
      }
    });
    spans.sort((a, b) => a.start - b.start);
    let out = '', pos = 0;
    spans.slice(0, 3).forEach(s => {
      out += esc(text.slice(pos, s.start)) + `<button type="button" class="term" data-t="${esc(s.term)}">${esc(s.term)}</button>`;
      pos = s.end;
    });
    return out + esc(text.slice(pos));
  }
  function showTerm(term) {
    const g = GLOSSARY.find(x => x[0] === term);
    if (!g) return;
    const box = $('#gl');
    box.innerHTML = `<b>${esc(g[0])}:</b> ${esc(g[1])} `;
    box.append(el('button', { type: 'button', class: 'lnk', text: 'ปิด', onclick: () => { box.hidden = true; } }));
    box.hidden = false;
  }

  /* ---------- แบบฝึกหัดท้ายบท ---------- */
  function innerField(pk, key) { return [...pk.layers].reverse().flatMap(l => l.fields).find(x => x.key === key); }
  function drawQuiz(last) {
    const box = $('#quiz'), msg = $('#hexMsg');
    S.find = null; msg.hidden = true;
    const q = lesson().quiz;
    if (!last || !q) { box.hidden = true; box.innerHTML = ''; return; }
    box.hidden = false;
    box.innerHTML = '<h3>ลองตอบ</h3>';

    const opts = el('div', { class: 'qopts' });
    const verdict = el('p', { class: 'qv', role: 'status' });
    let wrong = 0, solved = false;
    const res = { mc: false, find: false };
    S.quizRes = res;
    const donep = el('p', { class: 'qpass', role: 'status', text: passed[lesson().id] === true ? 'บทนี้ผ่านแบบฝึกหัดแล้ว ลองทำซ้ำได้' : '' });
    box.append(donep);
    const mark = () => {
      if (res.mc && res.find && passed[lesson().id] !== true) {
        passed[lesson().id] = true; store.set('pe-quiz', JSON.stringify(passed));
        donep.textContent = 'ผ่านแบบฝึกหัดบทนี้แล้ว'; drawRail(); drawProgress();
      }
    };
    S.quizMark = mark;
    q.o.forEach((t, i) => {
      opts.append(el('button', { type: 'button', class: 'qopt', text: t, onclick: e => {
        if (solved) return;
        stopPlay();
        if (i === q.a) { solved = true; res.mc = true; mark(); e.currentTarget.classList.add('ok'); verdict.textContent = `ถูกต้อง: ${q.why}`; opts.querySelectorAll('button').forEach(b => { if (b !== e.currentTarget) b.disabled = true; }); }
        else {
          wrong++; e.currentTarget.classList.add('no'); e.currentTarget.disabled = true;
          verdict.textContent = wrong >= q.o.length - 1 ? `คำตอบคือ "${q.o[q.a]}": ${q.why}` : 'ยังไม่ใช่ ลองอีกครั้ง';
          if (wrong >= q.o.length - 1) { solved = true; opts.children[q.a].classList.add('ok'); }
        }
      } }));
    });
    box.append(qp, opts, verdict);
    const target = innerField(step().pkt, q.find);
    const state = { field: target, why: q.findWhy, done: false };
    S.find = state;
    const fp = el('p', { class: 'q', text: `2. ในตารางไบต์ คลิกไบต์ของ "${target.name}"` });
    const row = el('div', { class: 'caplinks' });
    row.append(
      el('button', { type: 'button', class: 'lnk', text: 'ไปที่ตาราง', onclick: () => { stopPlay(); showPacket(); } }),
      el('button', { type: 'button', class: 'lnk', text: 'ดูเฉลย', onclick: () => {
        state.done = true; S.field = target; showPacket(); syncSel(); const row = $(`#ilist .fr[data-off="${target.off}"]`); if (row) scrollList(row);
        msg.textContent = `เฉลย: ${target.name} คือไบต์ที่ไฮไลต์ ${q.findWhy}`; msg.className = 'hexmsg'; msg.hidden = false;
      } }),
    );
