  function setInsp(on) {
    S.insp = on;
    root.classList.toggle('insp-open', on);
    if (on) { drawHex(); drawList(); }
    else if (S.vtab === 'net' && layName && !S.ov) animateToken(step(), false);
    postHeight();
  }
  function showPacket() {
    if (S.present) { setView('packet'); return; }
    setInsp(true);
    const t = $('.insp');
    if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest' });
  }
  function checkFind(x) {
    const f = S.find, msg = $('#hexMsg');
    if (!f || f.done) return;
    if (x === f.field) { f.done = true; msg.textContent = `ถูกต้อง: ${f.why}`; msg.className = 'hexmsg ok'; if (S.quizRes) { S.quizRes.find = true; S.quizMark(); } }
    else { msg.textContent = `ยังไม่ใช่: ไบต์นี้คือ "${x.name}" ลองอีกครั้ง`; msg.className = 'hexmsg no'; }
    msg.hidden = false;
  }

  /* ---------- แอนิเมชันแพ็กเก็ต ---------- */
  function tokenShape(st) {
    const tok = $('#tok');
    const tag = st.tag;
    const isThai = /[฀-๿]/.test(tag);
    const w = Math.max(40, (isThai ? tag.length * 7.6 : tag.length * 7.3) + (st.lock ? 34 : 20));
    const h = 24;
    const tx = st.lock ? -8 : 0;
    const lock = st.lock ? `<g transform="translate(${w / 2 - 13} 0)"><path d="M-4 -1h8v6h-8z M-2.500 -1v-2.500a2.500 2.500 0 0 1 5 0v2.500"/></g>` : '';
    tok.innerHTML = `<rect class="base" x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="${h / 2}"/><text class="${isThai ? 'thai' : ''}" x="${tx}" y="4.200" text-anchor="middle">${esc(tag)}</text>${lock}`;
    return { w, h };
  }

  function animateToken(st, animate) {
    cancelAnimationFrame(S.raf);
    const route = routeOf(st.from, st.to);
    const rt = $('#rt'), rest = $('#rtRest'), flow = $('#rtFlow'), tok = $('#tok');
    if (!rt) return;
    const d = routeD(route);
    rt.setAttribute('d', d);
    flow.setAttribute('d', '');
    const total = rt.getTotalLength();
    let { w } = tokenShape(st);
    const startAt = Math.min(w / 2 + 6, total * .3);
    const edgeLen = (a, b) => lengthOf(edgeD(FLOW.edges[`${a}-${b}`] || FLOW.edges[`${b}-${a}`]));
    /* แพ็กเก็ตหยุดกลางเส้นสุดท้าย จึงไม่บังชื่อบนการ์ด */
    const lastI = route.length - 1;
    let endAt = Math.max(startAt + 1, total - edgeLen(route[lastI - 1], route[lastI]) / 2);
    if (st.lost) {
      /* แพ็กเก็ตหายบนเส้นระหว่างเราเตอร์กับอินเทอร์เน็ต */
      const k = route.length > 2 ? 2 : 1;
      endAt = lengthOf(routeD(route, k)) - edgeLen(route[k - 1], route[k]) / 2;
    }
    /* จุดที่แพ็กเก็ตผ่านการ์ดแต่ละใบ */
    const stops = route.slice(1, -1).map((id, i) => ({ id, at: lengthOf(routeD(route, i + 1)), done: false }));
    rt.style.strokeDasharray = `${total} ${total}`;
    rest.setAttribute('d', '');
    tok.style.display = '';
    tok.style.opacity = 1;
    const call = $('#call'), vb = FLOW.vb;
    /* เส้นสั้นกว่าป้ายแพ็กเก็ต: ใช้จุดแทนเพื่อไม่ให้ทับข้อความบนการ์ด แล้วย้ายชื่อไปไว้ในป้ายด้านล่าง */
    const restK = st.lost ? (route.length > 2 ? 2 : 1) : lastI;
    const compact = !FLOW.vertical && w + 8 > edgeLen(route[restK - 1], route[restK]);
    if (compact) { tok.innerHTML = '<rect class="base" x="-8" y="-8" width="16" height="16" rx="8"/>'; w = 16; }
    const info = st.callout || (compact ? `${st.tag}: ${infoOf(st.pkt)}` : infoOf(st.pkt)), shortI = info.length > 46 ? info.slice(0, 44) + '…' : info;
    /* หัวลูกศรที่ปลายทางบอกทิศทางได้ แม้ปิดการเคลื่อนไหว */
    const head = $('#rtHead');
    if (st.lost) head.style.display = 'none';
    else {
      const pe = rt.getPointAtLength(total), pb = rt.getPointAtLength(Math.max(0, total - 8));
      head.style.display = '';
      head.setAttribute('transform', `translate(${pe.x - 10 * Math.cos(Math.atan2(pe.y - pb.y, pe.x - pb.x))} ${pe.y - 10 * Math.sin(Math.atan2(pe.y - pb.y, pe.x - pb.x))}) rotate(${Math.atan2(pe.y - pb.y, pe.x - pb.x) * 180 / Math.PI})`);
    }
    const cw = shortI.length * 6.95 + 18;
    const useCall = layName !== 'v';
    if (useCall) {
      call.style.display = '';
      call.setAttribute('transform', `translate(${vb[0] + (vb[2] - cw) / 2} ${vb[1] + vb[3] - 32})`);
      call.setAttribute('class', st.callout ? 'nat' : '');
      call.innerHTML = `<rect width="${cw}" height="26" rx="13"/><text x="9" y="17">${esc(shortI)}</text>`;
    } else { call.style.display = 'none'; call.innerHTML = ''; }
    const place = v => {
      const p = rt.getPointAtLength(v);
      tok.setAttribute('transform', `translate(${p.x} ${p.y})`);
      rt.style.strokeDashoffset = total - v;
      stops.forEach(sp => {
        if (!sp.done && v >= sp.at - w / 2 - 8) {
          sp.done = true;
          const n = mapEl.querySelector(`.node[data-id="${sp.id}"]`);
          if (n && !(st.lost && sp.at > endAt)) { n.classList.remove('hit'); void n.getBoundingClientRect(); n.classList.add('hit'); }
        }
      });
    };
    const finish = () => {
      place(endAt);
      if (st.lost) {
        const a = rt.getPointAtLength(endAt);
        const remain = [];
        for (let i = 0; i <= 40; i++) { const p = rt.getPointAtLength(endAt + (total - endAt) * i / 40); remain.push([p.x.toFixed(1), p.y.toFixed(1)]); }
        rest.setAttribute('d', dOf(remain));
        tok.setAttribute('transform', `translate(${a.x} ${a.y})`);
        tok.style.opacity = .85;
        tok.insertAdjacentHTML('beforeend', '<path d="M-6 -29l12 12 M6 -29l-12 12" style="stroke:var(--danger);stroke-width:3.500"/>');
      } else {
        rt.style.strokeDashoffset = 0;
      }
      if (!st.lost && !reduce.matches) {
        flow.setAttribute('d', d);
        if (animate) { const n = mapEl.querySelector(`.node[data-id="${st.to}"]`); if (n) { n.classList.remove('hit'); void n.getBoundingClientRect(); n.classList.add('hit'); } }
      }
      if (S.playing) { if (S.s < lesson().steps.length - 1) schedule(); else stopPlay(); }
    };
    if (!animate || reduce.matches) { stops.forEach(sp => { sp.done = true; }); finish(); return; }
    const dur = (1000 + total * 1.05) / speed();
    const t0 = performance.now();
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const tick = now => {
      const t = Math.min(1, (now - t0) / dur);
      place(startAt + (endAt - startAt) * ease(t));
      if (t < 1) S.raf = requestAnimationFrame(tick); else finish();
    };
    place(startAt);
    S.raf = requestAnimationFrame(tick);
  }

  /* ---------- เล่นอัตโนมัติ ---------- */
  /* ให้เวลาอ่านตามความยาวข้อความ ประมาณ 18 ตัวอักษรต่อวินาที */
  const readTime = st => Math.max(3000, 1200 + (st.title.length + st.text.length) * 55);
  function schedule() {
    clearTimeout(S.timer);
    S.timer = setTimeout(() => {
      if (!S.playing) return;
      const L = lesson();
      if (S.s < L.steps.length - 1) go(S.l, S.s + 1, true);
      else stopPlay();
    }, readTime(step()) / speed());
  }
  function setPlayLabel() { $('#play').textContent = S.playing ? 'หยุด' : 'เล่นทั้งบท'; }
  function startPlay() {
    S.playing = true; setPlayLabel();
    go(S.l, S.s >= lesson().steps.length - 1 && !S.ov ? 0 : S.s, true);
  }
  function stopPlay() { S.playing = false; clearTimeout(S.timer); if ($('#play')) setPlayLabel(); }

  /* ---------- ถอดรหัสแพ็กเก็ต ---------- */
  function renderPacket(keepSel) {
    const st = step(), pk = st.pkt, L = lesson();
    const inInsp = $('.insp').contains(document.activeElement);
    const fld = (st.focus && innerField(pk, st.focus)) || allFields(pk)[0];

    const srcIp = fieldOf(pk, 'ip', 'srcip'), dstIp = fieldOf(pk, 'ip', 'dstip');

    $('#iSeen').textContent = `จุดที่ดู: ${cap}. การสื่อสาร${srcIp ? 'ตาม IP' : ''}: ${logical}. เฟรมบนลิงก์นี้: ${macName('src')} ไป ${macName('dst')} (จำลอง Layer 2 เป็น Ethernet)`;

    drawList();
    drawHex();
    if (inInsp) { const a = document.querySelector('#iClose'); if (a && document.activeElement === document.body) a.focus({ preventScroll: true }); }
  }

  const OSI = { eth: 'OSI ชั้น 2', ip: 'OSI ชั้น 3', icmp: 'OSI ชั้น 3', tcp: 'OSI ชั้น 4', udp: 'OSI ชั้น 4', tls: 'เหนือ OSI ชั้น 4', arp: 'OSI ชั้น 2–3' };
  const OSI_NAME = { eth: 'Data Link', arp: 'Data Link กับ Network', ip: 'Network', icmp: 'Network', tcp: 'Transport', udp: 'Transport', tls: 'เหนือ Transport' };
  const LAYER_INFO = {
    eth: 'จ่าหน้าสำหรับส่งถึงเครื่องถัดไปบนลิงก์นี้ จะถูกเขียนใหม่ทุกครั้งที่ผ่านเราเตอร์ บทเรียนจำลองเป็น Ethernet II ส่วนเฟรมบนคลื่น Wi-Fi จริงเป็นรูปแบบ 802.11',

  const osiOf = id => OSI[id] || 'OSI ชั้น 7';
  function drawLayers() {
    const pk = step().pkt, bar = $('#lbar');
    const total = pk.bytes.length;
    bar.innerHTML = '';
    pk.layers.forEach(l => {
      const size = l.fields.reduce((a, x) => a + x.b.length, 0);

  function scrollList(n) {

  function drawList() {
    const pk = step().pkt, u = $('#ilist');
    u.innerHTML = '';
    pk.layers.forEach(l => {
      const size = l.fields.reduce((a, x) => a + x.b.length, 0);
      const sec = el('section', { class: `il tone-${l.tone}` });
      sec.append(el('h3', { 'data-layer': l.id, text: `${l.label}, ${size} ไบต์, ${osiOf(l.id)}` }), el('p', { class: 'il-d', text: LAYER_INFO[l.id] || '' }));
      l.fields.forEach(x => {
        const b = el('button', { type: 'button', class: 'fr', 'data-off': x.off, 'aria-pressed': String(S.field === x), onclick: () => { S.field = x; syncSel(); }, onmouseenter: () => { S.hover = x; paint(); }, onmouseleave: () => { S.hover = null; paint(); } });
        const same = x.val === x.name;
        b.append(el('span', { class: 'fr-n', text: same ? 'บรรทัดข้อความ' : x.name }), el('span', { class: 'fr-v', text: x.val }), el('span', { class: 'fr-d', text: x.desc }));
        if (x.bits) {
          const bits = el('span', { class: 'bits' });
          x.bits.forEach(t => { const c = el('span', { class: t.on ? 'on' : '' }); c.append(el('code', { text: t.b }), document.createTextNode(`${t.n}${t.v ? `: ${t.v}` : ''}`)); bits.append(c); });
          b.append(bits);
        }
        sec.append(b);
      });
      u.append(sec);
    });
    const on = u.querySelector('.fr[aria-pressed="true"]');
    if (on && u.scrollHeight > u.clientHeight + 1) u.scrollTop = Math.max(0, on.offsetTop - u.offsetTop - 40);
  }

  function fieldAt(i) { return allFields(step().pkt).find(x => i >= x.off && i < x.off + x.b.length); }
  const toneOf = x => step().pkt.layers.find(l => l.id === x.layer).tone;

  function drawHex() {
    const wrap = $('#hex');
    const pk = step().pkt, bytes = pk.bytes;
    const z = S.present && innerWidth > 860 ? Math.min(1.7, innerWidth / 1100) : 1;
    wrap.style.setProperty('--z', z);
    const w = wrap.clientWidth;
    /* ความกว้างที่ต้องใช้ = เลขตำแหน่ง + ช่องไบต์ + ช่องว่าง + คอลัมน์ข้อความ + ขอบ */
    const room = w ? (w - (40 + 12 + 16 * 9) * z - 5 - 12) / 16 : 25 * z;
    const per = room >= 18 * z ? 16 : 8;
    const cell = per === 16 ? Math.min(25 * z, Math.floor(room)) : (matchMedia('(max-width: 680px)').matches ? Math.max(20, Math.min(27, Math.floor((w - 12 - 34 - 8 - 64 - 5) / 8))) : 22 * z);
    S.bytesPerRow = per;
    wrap.style.setProperty('--bw', cell + 'px');
    const prev = step().diff && S.s > 0 ? lesson().steps[S.s - 1].pkt.bytes : null;
    const owner = new Array(bytes.length);
    allFields(pk).forEach(x => { for (let i = 0; i < x.b.length; i++) owner[x.off + i] = x; });
    let h = `<div class="row rhead"><span class="off"></span><span class="rb" style="width:${per * cell + 5}px">ไบต์ (เลขฐานสิบหก)</span><span class="asc">ข้อความ</span></div>`;
    for (let r = 0; r < bytes.length; r += per) {
      let by = '', as = '';
      for (let i = r; i < Math.min(r + per, bytes.length); i++) {
        const v = bytes[i];
        const ow = owner[i];
        const chg = prev && prev.length === bytes.length && prev[i] !== v;
        const gap = i - r === per / 2 ? ' gap' : '';
        by += `<span class="by tone-${toneOf(ow)}${chg ? ' chg' : ''}${gap}" data-i="${i}">${hx2(v)}</span>`;
        const pr = v >= 32 && v < 127;
        as += `<span class="ch tone-${toneOf(ow)}${pr ? ' hi' : ''}" data-i="${i}">${pr ? esc(String.fromCharCode(v)) : '·'}</span>`;
      }
      h += `<div class="row"><span class="off">${r.toString(16).padStart(4, '0')}</span><span class="byts">${by}</span><span class="asc">${as}</span></div>`;
    }
    wrap.innerHTML = h;
    paint();
    scrollHex();
  }
  function paint() {
    const hexEl = $('#hex');
    hexEl.querySelectorAll('.sel,.hov').forEach(n => n.classList.remove('sel', 'hov'));
    const mark = (x, c) => {
      if (!x) return;
      for (let i = x.off; i < x.off + x.b.length; i++) hexEl.querySelectorAll(`[data-i="${i}"]`).forEach(n => n.classList.add(c));
    };
    if (S.field) mark(S.field, 'sel');
    else { const l = step().pkt.layers.find(y => y.id === S.layer); if (l) l.fields.forEach(x => mark(x, 'sel')); }
    if (S.hover && S.hover !== S.field) mark(S.hover, 'hov');
  }
  function scrollHex() {
    const hexEl = $('#hex');
    const l0 = step().pkt.layers.find(y => y.id === S.layer);
    const anchor = S.field || (l0 && l0.fields[0]);
    const n = anchor && hexEl.querySelector(`[data-i="${anchor.off}"]`);
    if (!n) return;
    const top = n.offsetTop - hexEl.offsetTop;
    if (top < hexEl.scrollTop || top > hexEl.scrollTop + hexEl.clientHeight - 44) hexEl.scrollTop = Math.max(0, top - 44);
  }
  function syncSel() {
    stopPlay(); /* ผู้เรียนกำลังดูแพ็กเก็ตนี้ จึงไม่เปลี่ยนขั้นแทรก */
    if (S.field) S.layer = S.field.layer;
    S.hover = null;
    $('#ilist').querySelectorAll('.fr').forEach(b => b.setAttribute('aria-pressed', String(!!S.field && +b.dataset.off === S.field.off)));
    $('#lbar').querySelectorAll('.lb').forEach((b, i) => b.setAttribute('aria-pressed', String(!S.field && step().pkt.layers[i].id === S.layer)));
    paint(); scrollHex();
  }

  const isNarrow = () => matchMedia('(max-width: 860px)').matches;

  /* ---------- โหมดสอน ---------- */
  function setView(v) {
    S.pview = v;
    root.classList.toggle('pv-packet', S.present && v === 'packet');
    $('#viewBtn').textContent = v === 'packet' ? 'ดูแผนภาพ' : 'แกะแพ็กเก็ต';
    if (S.present) drawHex();
  }
  function setPresent(on) {
    S.present = on;
    root.classList.toggle('present', on);
    if (on) $('#guide').hidden = true;
    setView('map');
    $('#presentBtn').textContent = on ? 'ออกจากโหมดสอน' : 'โหมดสอน';
    if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    if (layName) { drawMap(); renderStep(false); }
    postHeight();
  }
  function togglePresent() {
    if (!S.present && window.parent !== window) {
      /* อยู่ในเว็บแม่ให้เปิดแท็บใหม่ จะได้เต็มพื้นที่จอโปรเจกเตอร์ */
      const u = new URL(location.href);
      u.searchParams.set('present', '1');
      u.hash = `${lesson().id}/${S.s + 1}`;
      let w = null;
      try { w = window.open(u.href, '_blank'); } catch (e) { /* ถูกบล็อก */ }
      if (w) { try { w.opener = null; } catch (e) { /* ไม่ต้องทำอะไร */ } return; }
    }
    setPresent(!S.present);
  }
  function toggleFs() {
    const r = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (r.requestFullscreen) r.requestFullscreen().catch(() => { flash('เบราว์เซอร์นี้ไม่อนุญาตให้เต็มจอจากหน้านี้ กด F11 แทนได้'); });
    else flash('เบราว์เซอร์นี้ไม่รองรับปุ่มเต็มจอ กด F11 แทนได้');
  }

  /* ---------- แชร์ ---------- */
  function flash(t) {
    const m = $('#shareMsg');
    m.textContent = t; m.hidden = false;
    clearTimeout(S.flashT);
    S.flashT = setTimeout(() => { m.hidden = true; }, 6000);
  }
  function shareLink() {
    const base = (cfg.shareUrl || S.parentUrl || location.href).split('#')[0].replace(/[?&]present=1/, '');
    return S.ov ? `${base}#${lesson().id}` : `${base}#${lesson().id}/${S.s + 1}`;
  }
  async function share() {
    const url = shareLink();
    const L = lesson();
    if (navigator.share && matchMedia('(pointer: coarse)').matches) {
      try { await navigator.share({ title: `${L.name}: ${L.full}`, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); flash('คัดลอกลิงก์ของบทนี้แล้ว'); return; } catch (e) { /* ใช้วิธีสำรอง */ }
    const t = el('textarea', { readonly: 'readonly', style: 'position:fixed;opacity:0' });
    t.value = url; document.body.append(t); t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    t.remove();
    flash(ok ? 'คัดลอกลิงก์ของบทนี้แล้ว' : `คัดลอกลิงก์นี้: ${url}`);
  }

  /* ---------- เหตุการณ์ ---------- */
  $('#hex').addEventListener('click', e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i === undefined) return;
    S.field = fieldAt(+i); syncSel(); checkFind(S.field);
    const row = $(`#ilist .fr[data-off="${S.field.off}"]`);
    if (row) scrollList(row);
  });
  $('#sText').addEventListener('click', e => { const t = e.target.dataset && e.target.dataset.t; if (t) { stopPlay(); showTerm(t); } });
  $('#moreBtn').addEventListener('click', e => { const i = LESSONS.findIndex(x => x.id === e.currentTarget.dataset.id); if (i >= 0) { go(i, 0, false, true); $('#ovTitle').scrollIntoView({ block: 'nearest' }); } });
  $('#inspBtn').addEventListener('click', () => {
    if (S.present) { setView('packet'); return; }
    showPacket();
  });
  $('#iClose').addEventListener('click', () => { if (S.present) setView('map'); else { setInsp(false); $('#inspBtn').focus({ preventScroll: true }); } });
  $('#iPrev').addEventListener('click', () => { stopPlay(); if (S.s > 0) go(S.l, S.s - 1, false); });
  $('#iNext').addEventListener('click', () => { stopPlay(); if (S.s < lesson().steps.length - 1) go(S.l, S.s + 1, false); });
  $('#ovBtn').addEventListener('click', () => { stopPlay(); go(S.l, S.s, false, true); });
  $('#ovStart').addEventListener('click', () => { go(S.l, S.s, true); $('#sTitle').focus({ preventScroll: true }); });
  $('#guideBtn').addEventListener('click', e => { const g = $('#guide'); g.hidden = !g.hidden; e.currentTarget.setAttribute('aria-expanded', String(!g.hidden)); store.set('pe-guide', g.hidden ? 'closed' : 'open'); postHeight(); });
  $('#toQuiz').addEventListener('click', () => { $('#after').scrollIntoView({ block: 'nearest' }); });
  $('#tabNet').addEventListener('click', () => setTab('net'));
  $('#tabSeq').addEventListener('click', () => setTab('seq'));
  $('#resetBtn').addEventListener('click', () => { stopPlay(); setInsp(false); go(S.l, 0, false, true); });
  $('#ftAll').addEventListener('click', () => { S.ftAll = !S.ftAll; syncFlowTable(); postHeight(); });
  $('#ftBody').addEventListener('click', e => { const tr = e.target.closest('tr[data-i]'); if (tr && !tr.classList.contains('future')) { stopPlay(); go(S.l, +tr.dataset.i, false); showPacket(); } });
  const seqGo = e => { const g = e.target.closest && e.target.closest('.sq'); if (g) { stopPlay(); go(S.l, +g.dataset.i, true); } };
  $('#seq').addEventListener('click', seqGo);
  $('#seq').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault(); e.stopPropagation(); seqGo(e);
    const g = $(`.sq[data-i="${S.s}"]`); if (g) g.focus({ preventScroll: true });
  });
  $('#lesSel').addEventListener('change', e => { const i = LESSONS.findIndex(x => x.id === e.target.value); if (i >= 0) go(i, 0, false, true); });
  $('#shareBtn').addEventListener('click', share);
  $('#presentBtn').addEventListener('click', togglePresent);
  $('#viewBtn').addEventListener('click', () => setView(S.pview === 'packet' ? 'map' : 'packet'));
  $('#fsBtn').addEventListener('click', toggleFs);
  $('#glossAll').innerHTML = [...GLOSSARY].map(g => `<div><dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd></div>`).join('');
  window.addEventListener('message', e => {
    if (e.source !== window.parent || !e.data || e.data.type !== 'protocol-explorer:parent') return;
    if (typeof e.data.url === 'string' && /^https?:\/\//.test(e.data.url)) S.parentUrl = e.data.url;
  });
  $('#hex').addEventListener('mouseover', e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i === undefined) return;
    const x = fieldAt(+i);
    if (x !== S.hover) { S.hover = x; paint(); }
  });
  $('#hex').addEventListener('mouseleave', () => { S.hover = null; paint(); });
  $('#prev').addEventListener('click', () => { stopPlay(); if (S.s > 0 && !S.ov) go(S.l, S.s - 1, true); });
  $('#next').addEventListener('click', () => {
    stopPlay();
    if (S.ov) go(S.l, S.s, true);
    else if (S.s < lesson().steps.length - 1) go(S.l, S.s + 1, true);
    else if (S.l < LESSONS.length - 1) { go(S.l + 1, 0, false, true); $('#ovTitle').scrollIntoView({ block: 'nearest' }); }
  });
  $('#play').addEventListener('click', () => { if (S.playing) stopPlay(); else startPlay(); });
  const setThemeBtn = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    $('#themeBtn').textContent = dark ? 'โหมดสว่าง' : 'โหมดมืด';
  };
  $('#themeBtn').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    store.set('pe-theme', root.dataset.theme);
    setThemeBtn();
  });
  document.addEventListener('keydown', e => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { $('#next').click(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { $('#prev').click(); e.preventDefault(); }
    if (e.key === 'Escape' && S.insp && !S.present) { $('#iClose').click(); return; }
    if (!S.present) return;
    if (e.key === 'PageDown') { $('#next').click(); e.preventDefault(); }
    if (e.key === 'PageUp') { $('#prev').click(); e.preventDefault(); }
    if (e.key === ' ') { $('#play').click(); e.preventDefault(); }
    if (e.key === 'i' || e.key === 'I') setView(S.pview === 'packet' ? 'map' : 'packet');
    if (e.key === 'f' || e.key === 'F') toggleFs();
    if (e.key === 'Escape' && !document.fullscreenElement) setPresent(false);
  });

  /* ส่งความสูงให้หน้าเว็บแม่ เพื่อให้ iframe ยืดตามเนื้อหา */
  function postHeight() {
    if (window.parent === window) return;
    try { window.parent.postMessage({ type: 'protocol-explorer:height', height: Math.ceil(app.getBoundingClientRect().height) }, '*'); } catch (e) { /* ไม่มีหน้าแม่ */ }
  }
  if ('ResizeObserver' in window) new ResizeObserver(postHeight).observe(app);

  let rzT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rzT);
    rzT = setTimeout(() => {
      const next = chooseLayout();
      if (next !== layName) { drawMap(); renderStep(false); } else { drawHex(); drawSeq(); }
    }, 120);
  });

  /* ---------- เริ่มต้น ---------- */
  $('#foot').textContent = cfg.footer || 'แพ็กเก็ตในหน้านี้สร้างตามรูปแบบจริงของแต่ละโปรโตคอลเพื่อการเรียนรู้ ไม่ได้จับจากการใช้งานจริง ที่อยู่ ชื่อ และรหัสผ่านเป็นค่าตัวอย่าง ข้อมูลที่เข้ารหัสเป็นค่าสุ่มและย่อขนาดเพื่อให้อ่านง่าย เวลาในตารางเป็นค่าตัวอย่าง ส่วนชั้น OSI เป็นการเทียบเพื่อการเรียนรู้ เฟรม Ethernet เป็นการจำลอง Layer 2 แบบง่าย ไม่ใช่เฟรม 802.11 ของ Wi-Fi จริง';
  setPlayLabel();
  setThemeBtn();
  const m = /^#([a-z0-9]+)(?:\/(\d+))?$/.exec(location.hash);
  const startId = (m && m[1]) || qs.get('lesson') || cfg.startLesson;
  let li = LESSONS.findIndex(l => l.id === startId);
  if (li < 0) li = 0;
  const si = m && m[2] ? Math.min(Math.max(0, +m[2] - 1), LESSONS[li].steps.length - 1) : 0;
  S.l = li; S.s = si;
  $('#guide').hidden = store.get('pe-guide') !== 'open';
  const boot = () => {
    S.present = qs.get('present') === '1';
    root.classList.toggle('present', S.present);
    if (S.present) $('#guide').hidden = true;
    setView('map');
    $('#presentBtn').textContent = S.present ? 'ออกจากโหมดสอน' : 'โหมดสอน';
    S.ov = !(m && m[2]);
    drawRail(); drawMap(); renderLesson(); setTab('net'); setInsp(qs.get('inspect') === '1');
    renderStep(false); setUrl(); postHeight();
  };
  /* วางลิงก์บทอื่นในแท็บเดิม หน้าไม่โหลดใหม่ จึงต้องฟัง hash เอง */
  window.addEventListener('hashchange', () => {
    const h = /^#([a-z0-9]+)(?:\/(\d+))?$/.exec(location.hash);
    const i = h ? LESSONS.findIndex(l => l.id === h[1]) : -1;
    if (i < 0) return;
    stopPlay();
    go(i, h[2] ? Math.min(Math.max(0, +h[2] - 1), LESSONS[i].steps.length - 1) : 0, false, !h[2]);
    postHeight();
  });
  /* NetPrime Lesson Kit (docs/SELF-LEARNING-LESSON-KIT.md): สีหลักตามธีมของเว็บ และเก็บความคืบหน้าของผู้เรียนที่ login
     ไว้ในระบบ เพื่อเรียนต่อจากเครื่องอื่นได้ ความคืบหน้าในเครื่องยังเก็บแบบเดิม (pe-prog, pe-seen, pe-quiz) */
  (function lessonKit() {
    if (window.parent === window) return;
    const P = 'netprime-lesson:';
    const send = (type, data = {}) => { try { window.parent.postMessage({ ...data, type: P + type }, '*'); } catch (e) { /* ไม่มีหน้าแม่ */ } };
    const percent = () => {
      const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
      return Math.round(LESSONS.reduce((n, l) => n + seenSet(l).size, 0) / total * 100);
    };
    const report = () => send('progress', {
      percent: percent(), completed: LESSONS.every(l => lessonState(l) === 'pass'), state: { prog, seen, quiz: passed }
    });
    let timer = 0;
    const write = store.set;
    store.set = (k, v) => {
      write(k, v);
      if (k === 'pe-prog' || k === 'pe-seen' || k === 'pe-quiz') { clearTimeout(timer); timer = setTimeout(report, 1000); }
    };
    const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    /* รวมค่าที่บันทึกไว้เข้ากับในเครื่อง: เลือกค่าที่ไปไกลกว่า เรียกซ้ำได้ผลเท่าเดิม */
    const merge = saved => {
      let changed = false;
      for (const [id, n] of Object.entries(obj(saved.prog))) {
        if (Number.isInteger(n) && !(prog[id] >= n)) { prog[id] = n; changed = true; }
      }
      for (const [id, list] of Object.entries(obj(saved.seen))) {
        if (!Array.isArray(list)) continue;
        const set = new Set(Array.isArray(seen[id]) ? seen[id] : []);
        const before = set.size;
        list.forEach(n => { if (Number.isInteger(n)) set.add(n); });
        if (set.size !== before) { seen[id] = [...set]; changed = true; }
      }
      for (const [id, ok] of Object.entries(obj(saved.quiz))) {
        if (ok === true && passed[id] !== true) { passed[id] = true; changed = true; }
      }
      return changed;
    };
    let accentStyle = null;
    window.addEventListener('message', e => {
      if (e.source !== window.parent || !e.data || typeof e.data.type !== 'string') return;
      if (e.data.type === P + 'theme' && !cfg.accent) {
        const color = obj(obj(e.data.theme).vars)['--np-primary'];
        if (typeof color !== 'string' || !/^#[0-9a-f]{6}$/i.test(color)) return;
        accentStyle = accentStyle || document.head.appendChild(document.createElement('style'));
        /* ใช้กับโหมดสว่างเท่านั้น โหมดมืดคงสีเดิมเพื่อให้อ่านง่าย */
        accentStyle.textContent = `:root[data-theme="light"] { --accent: ${color}; --accent-ink: #ffffff; }`;
      }
      if (e.data.type === P + 'restore' && e.data.signedIn) {
        const before = percent();
        if (merge(obj(e.data.state))) {
          write('pe-prog', JSON.stringify(prog)); write('pe-seen', JSON.stringify(seen)); write('pe-quiz', JSON.stringify(passed));
          try { drawRail(); drawProgress(); } catch (err) { /* ยังไม่ boot ก็จะวาดตอน boot */ }
        }
        /* ความคืบหน้าในเครื่องนี้ไปไกลกว่าที่บันทึกไว้ ส่งขึ้นระบบ */
        if (before > (Number(e.data.percent) || 0) || (before > 0 && !e.data.state)) report();
      }
    });
    send('ready');
  })();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
})();

</script>
</body>
</html>
