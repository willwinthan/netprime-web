(function () {
  var P = 'netprime-lesson:';

  function send(type, data) {
    if (!embedded) return;
    var message = data || {};
    message.type = P + type;
    try { window.parent.postMessage(message, '*'); } catch (e) { /* ไม่มีหน้าแม่ */ }
  }
  function applyTheme(theme) {

  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || typeof e.data.type !== 'string' || e.data.type.indexOf(P) !== 0) return;
    var type = e.data.type.slice(P.length);
    if (type === 'theme') { applyTheme(e.data.theme); themeHandlers.forEach(function (fn) { fn(e.data.theme); }); }
    if (type === 'parent' && typeof e.data.url === 'string' && /^https?:\/\//.test(e.data.url)) kit.shareUrl = e.data.url;
    if (type === 'restore') { lastRestore = e.data; restoreHandlers.forEach(function (fn) { fn(e.data.state, e.data); }); }
  });
  var kit = {
    /** true เมื่อเปิดอยู่ในเว็บ NetPrime, false เมื่อเปิดไฟล์ตรง ๆ */
    embedded: embedded,
    /** ลิงก์หน้าบทเรียนบนเว็บ ใช้กับปุ่มแชร์ (null จนกว่าเว็บจะส่งมา) */

    onRestore: function (fn) { restoreHandlers.push(fn); if (lastRestore) fn(lastRestore.state, lastRestore); },

<script>
/* ENGINE START: ตรรกะการส่งเฟรม เป็นฟังก์ชันล้วน ไม่แตะหน้าเว็บ */
const PCS = {
  A: { sw: 'SW1', port: 'Fa0/1', mac: '0050.7966.000a', ip: '192.168.10.11', dept: 'ฝ่ายขาย' },
  B: { sw: 'SW1', port: 'Fa0/2', mac: '0050.7966.000b', ip: '192.168.20.12', dept: 'ฝ่ายบุคคล' },
  C: { sw: 'SW2', port: 'Fa0/1', mac: '0050.7966.000c', ip: '192.168.10.13', dept: 'ฝ่ายขาย' },
  D: { sw: 'SW2', port: 'Fa0/2', mac: '0050.7966.000d', ip: '192.168.20.14', dept: 'ฝ่ายบุคคล' }
};
const ROUTER = { mac: '00a0.c9aa.0001', gw: { 10: '192.168.10.1', 20: '192.168.20.1' } };

/** เฟรมจาก VLAN `vlan` ออกจากสวิตช์ `fromSw` ข้ามลิงก์ระหว่างสวิตช์ได้ไหม ติดแท็กอะไร และไปตกที่ VLAN ไหนอีกฝั่ง */
function crossLink(link, vlan, fromSw) {
  if (link.mode === 'access') {
    return vlan === link.access ? { crosses: true, tag: null, arrivesIn: link.access } : { crosses: false };
  }
  const allowed = link.allowed || [];
  if (!allowed.includes(vlan)) return { crosses: false };
  const myNative = fromSw === 'SW1' ? link.native1 : link.native2;
  const otherNative = fromSw === 'SW1' ? link.native2 : link.native1;
  const tag = vlan === myNative ? null : vlan;
  const arrivesIn = tag === null ? otherNative : tag;
  if (!allowed.includes(arrivesIn)) return { crosses: false };
  return { crosses: true, tag, arrivesIn };
}

/** PC `src` ส่ง broadcast: ใครได้รับ และเฟรมวิ่งผ่านลิงก์ไหนบ้าง (stage เดียวกันวิ่งพร้อมกัน) */
function broadcast(cfg, src) {
  const vlan = cfg.ports[src];
  const sw = PCS[src].sw;
  const other = sw === 'SW1' ? 'SW2' : 'SW1';
  const hops = [{ stage: 0, from: src, to: sw, tag: null, vlan }];
  const receivers = [];
  for (const p of Object.keys(PCS)) {
    if (p !== src && PCS[p].sw === sw && cfg.ports[p] === vlan) {
      receivers.push(p);
      hops.push({ stage: 1, from: sw, to: p, tag: null, vlan });
    }
  }
  const x = crossLink(cfg.link, vlan, sw);
  if (x.crosses) {
    hops.push({ stage: 1, from: sw, to: other, tag: x.tag, vlan, trunk: cfg.link.mode === 'trunk' });
    for (const p of Object.keys(PCS)) {
      if (PCS[p].sw === other && cfg.ports[p] === x.arrivesIn) {
        receivers.push(p);
        hops.push({ stage: 2, from: other, to: p, tag: null, vlan: x.arrivesIn });
      }
    }
  }
  receivers.sort();
  return { vlan, receivers, hops, crossed: !!x.crosses, arrivesIn: x.crosses ? x.arrivesIn : null, trunkTag: x.crosses ? x.tag : null };
}

/** แท็ก 802.1Q 4 ไบต์: TPID 0x8100 ตามด้วย PCP (3 บิต), DEI (1 บิต), VID (12 บิต) */
function dot1qTag(vid, pcp = 0, dei = 0) {
  if (!Number.isInteger(vid) || vid < 1 || vid > 4094) throw new RangeError('VLAN ID ต้องอยู่ระหว่าง 1 ถึง 4094');
  if (!Number.isInteger(pcp) || pcp < 0 || pcp > 7) throw new RangeError('PCP ต้องอยู่ระหว่าง 0 ถึง 7');
  if (dei !== 0 && dei !== 1) throw new RangeError('DEI ต้องเป็น 0 หรือ 1');
  return [0x81, 0x00, (pcp << 5) | (dei << 4) | (vid >> 8), vid & 0xff];
}

/** PC A (VLAN 10) ส่งหา PC B (VLAN 20) ผ่านเราเตอร์แบบ router-on-a-stick ที่ต่อ trunk กับ SW1 */
function routeAtoB() {
  const a = PCS.A, b = PCS.B;
  const ip = { srcIp: a.ip, dstIp: b.ip };
  return [
    { stage: 0, from: 'A', to: 'SW1', link: 'PC A → SW1 (access VLAN 10)', tag: null, vlan: 10, srcMac: a.mac, dstMac: ROUTER.mac, ...ip },
    { stage: 1, from: 'SW1', to: 'R1', link: 'SW1 → R1 (trunk)', tag: 10, vlan: 10, trunk: true, srcMac: a.mac, dstMac: ROUTER.mac, ...ip },
    { stage: 2, from: 'R1', to: 'SW1', link: 'R1 → SW1 (trunk)', tag: 20, vlan: 20, trunk: true, srcMac: ROUTER.mac, dstMac: b.mac, ...ip },
    { stage: 3, from: 'SW1', to: 'B', link: 'SW1 → PC B (access VLAN 20)', tag: null, vlan: 20, srcMac: ROUTER.mac, dstMac: b.mac, ...ip }
  ];
}

/** เป้าหมายของแล็บ: A ถึง C เท่านั้น และ B ถึง D เท่านั้น */
function labGoals(cfg) {
  const a = broadcast(cfg, 'A').receivers.join();
  const b = broadcast(cfg, 'B').receivers.join();
  return { aToC: a === 'C', bToD: b === 'D' };
}

const FLAT = { ports: { A: 1, B: 1, C: 1, D: 1 }, link: { mode: 'access', access: 1, allowed: [1], native1: 1, native2: 1 } };
const SPLIT = { ports: { A: 10, B: 20, C: 10, D: 20 }, link: { mode: 'trunk', access: 1, allowed: [1, 10, 20], native1: 1, native2: 1 } };
const NATIVE_BAD = { ports: { A: 10, B: 20, C: 10, D: 20 }, link: { mode: 'trunk', access: 1, allowed: [1, 10, 20], native1: 10, native2: 20 } };
/* ENGINE END */

<script>

const SVGNS = 'http://www.w3.org/2000/svg';
const POS = { A: [85, 92], B: [85, 290], C: [575, 92], D: [575, 290], SW1: [222, 190], SW2: [438, 190], R1: [222, 48] };
const vcol = v => `var(--v${[1, 10, 20, 99].includes(v) ? v : 1})`;
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let animToken = 0;
/* requestAnimationFrame หยุดเมื่อแท็บถูกซ่อน ใช้ตัวจับเวลาแทนเพื่อให้ภาพเคลื่อนไหวจบเสมอ */
const tick = fn => document.hidden ? setTimeout(() => fn(performance.now()), 40) : requestAnimationFrame(fn);

function el(name, attrs, text) {
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

/** วาดผัง: PC สี่เครื่อง สวิตช์สองตัว และเราเตอร์ (ถ้า opts.router) */
function drawTopo(svg, cfg, opts = {}) {
  svg.innerHTML = '';
  svg.setAttribute('viewBox', '0 0 660 350');
  const links = el('g'), nodes = el('g'), labels = el('g');
  svg.append(links, nodes, labels);
  const line = (a, b, trunk) => {
    const [x1, y1] = POS[a], [x2, y2] = POS[b];
    links.append(el('line', { x1, y1, x2, y2, class: trunk ? 'link trunk' : 'link' }));
    if (trunk) links.append(el('line', { x1, y1, x2, y2, class: 'link trunk-inner' }));
  };
  for (const p of Object.keys(PCS)) line(p, PCS[p].sw, false);
  line('SW1', 'SW2', cfg.link.mode === 'trunk');
  if (opts.router) line('SW1', 'R1', true);

  // ป้ายบนลิงก์ระหว่างสวิตช์
  const lk = cfg.link;
  const linkText = lk.mode === 'trunk' ? `trunk · VLAN ${lk.allowed.join(',') || '-'}` : `access · VLAN ${lk.access}`;
  labels.append(el('text', { x: 330, y: 156, 'text-anchor': 'middle', class: 'lbl-strong' }, linkText));
  labels.append(el('text', { x: 330, y: 210, 'text-anchor': 'middle', class: 'lbl-muted' }, 'Gi0/1 ↔ Gi0/1'));
  if (opts.showNative && lk.mode === 'trunk') {
    labels.append(el('text', { x: 222, y: 236, 'text-anchor': 'middle', class: 'lbl' }, `native ${lk.native1}`));
    labels.append(el('text', { x: 438, y: 236, 'text-anchor': 'middle', class: 'lbl' }, `native ${lk.native2}`));
  }
  if (opts.router) labels.append(el('text', { x: 232, y: 122, class: 'lbl-muted' }, 'Gi0/2 trunk · VLAN 10,20'));

  // สวิตช์และเราเตอร์
  const box = (id, label, sub) => {
    const [x, y] = POS[id];
    const g = el('g');
    g.append(el('rect', { x: x - 58, y: y - 22, width: 116, height: 44, rx: 8, class: 'sw-box' }));
    g.append(el('text', { x, y: y + 5, 'text-anchor': 'middle', class: 'sw-text' }, label));
    if (sub) g.append(el('text', { x: x + 66, y: y + 5, class: 'lbl-muted' }, sub));
    nodes.append(g);
  };
  box('SW1', 'SW1');
  box('SW2', 'SW2');
  if (opts.router) box('R1', 'R1 (เราเตอร์)', 'g0/0.10 · g0/0.20');

  // PC พร้อมป้าย VLAN (ตัวเลขกำกับสีเสมอ)
  for (const p of Object.keys(PCS)) {
    const [x, y] = POS[p];
    const v = cfg.ports[p];
    const g = el('g');
    g.append(el('rect', { x: x - 62, y: y - 26, width: 124, height: 52, rx: 10, class: 'node-box' }));
    g.append(el('text', { x, y: y - 5, 'text-anchor': 'middle', class: 'lbl-strong' }, `PC ${p}`));
    g.append(el('rect', { x: x - 38, y: y + 3, width: 76, height: 18, rx: 9, style: `fill:${vcol(v)}` }));
    g.append(el('text', { x, y: y + 16, 'text-anchor': 'middle', style: 'fill:#fff;font-size:12px;font-weight:700' }, `VLAN ${v}`));
    const [sx, sy] = POS[PCS[p].sw];
    const px = x + (sx - x) * 0.62, py = y + (sy - y) * 0.62;
    labels.append(el('text', { x: px + (x < sx ? -6 : 6), y: py + (y < sy ? -8 : 16), 'text-anchor': x < sx ? 'end' : 'start', class: 'lbl-muted' }, PCS[p].port));
    nodes.append(g);
  }
  svg.setAttribute('aria-label', `ผังเครือข่าย: ${Object.keys(PCS).map(p => `PC ${p} อยู่ VLAN ${cfg.ports[p]} ที่ ${PCS[p].sw} พอร์ต ${PCS[p].port}`).join(', ')}; ลิงก์ระหว่างสวิตช์เป็น ${linkText}`);
}

/** ป้าย "ได้รับ" / "ไม่ได้รับ" เหนือ PC */
function markResults(svg, src, receivers, only) {
  const g = el('g');
  for (const p of Object.keys(PCS)) {
    if (p === src || (only && !only.includes(p))) continue;
    const [x, y] = POS[p];
    const ok = receivers.includes(p);
    const yy = y < 190 ? y - 50 : y + 29;
    g.append(el('rect', { x: x - 38, y: yy, width: 76, height: 20, rx: 10, class: ok ? 'badge-ok' : 'badge-no' }));
    g.append(el('text', { x, y: yy + 14, 'text-anchor': 'middle', class: ok ? 'badge-ok-text' : 'badge-no-text' }, ok ? 'ได้รับ' : 'ไม่ได้รับ'));
  }
  svg.append(g);
}

/** เล่นภาพเฟรมวิ่งตาม hops ทีละ stage แล้วเรียก done() */
function animate(svg, hops, done) {
  const token = ++animToken;
  const stages = [...new Set(hops.map(h => h.stage))].sort((a, b) => a - b);
  const layer = el('g');
  svg.append(layer);
  const dur = reduceMotion() ? 0 : 850;
  let i = 0;
  const runStage = () => {
    if (token !== animToken) return;
    if (i >= stages.length) { layer.remove(); done && done(); return; }
    const items = hops.filter(h => h.stage === stages[i]).map(h => {
      const g = el('g');
      g.append(el('circle', { r: 9, class: 'frame-dot', style: `fill:${vcol(h.vlan)}` }));
      if (h.trunk) {
        const text = h.tag === null ? 'ไม่มีแท็ก' : `แท็ก VID ${h.tag}`;
        const w = text.length * 7 + 14;
        g.append(el('rect', { x: -w / 2, y: -34, width: w, height: 20, rx: 5, class: 'tag-box' }));
        g.append(el('text', { x: 0, y: -20, 'text-anchor': 'middle', class: 'tag-text' }, text));
      }
      layer.append(g);
      return { g, a: POS[h.from], b: POS[h.to] };
    });
    const t0 = performance.now();
    const frame = now => {
      if (token !== animToken) return;
      const t = dur ? Math.min(1, (now - t0) / dur) : 1;
      const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      for (const it of items) it.g.setAttribute('transform', `translate(${it.a[0] + (it.b[0] - it.a[0]) * e},${it.a[1] + (it.b[1] - it.a[1]) * e})`);
      if (t < 1) tick(frame);
      else { items.forEach(it => it.g.remove()); i++; setTimeout(runStage, dur ? 120 : 0); }
    };
    tick(frame);
  };
  runStage();
}

const names = list => list.length ? list.map(p => `PC ${p}`).join(', ') : 'ไม่มีใคร';
const chip = v => `<span class="chip v${[1, 10, 20, 99].includes(v) ? v : 1}">VLAN ${v}</span>`;

/** ฉากมาตรฐาน: ผัง + ปุ่มส่ง broadcast + บรรทัดผลลัพธ์ */
function sceneHtml(id, buttons) {
  return `<div class="scene"><svg id="${id}" role="img"></svg>
    <div class="row">${buttons}</div>
    <p class="log" id="${id}-log" aria-live="polite"></p></div>`;
}
function wireBroadcast(svgId, getCfg, explain, opts = {}) {
  const svg = document.getElementById(svgId);
  const log = document.getElementById(`${svgId}-log`);
  drawTopo(svg, getCfg(), opts);
  return src => {
    const cfg = getCfg();
    const r = broadcast(cfg, src);
    drawTopo(svg, cfg, opts);
    log.innerHTML = `PC ${src} ส่ง broadcast…`;
    animate(svg, r.hops, () => {
      markResults(svg, src, r.receivers);
      log.innerHTML = explain(src, r, cfg);
      kit.resize();
    });
  };
}
</script>

/* ---------- การทำงาน ---------- */
const KEY = 'netprime-vlan-v1-progress';
const STEP_IDS = STEPS.map(s => s.id);
const QUIZ_IDS = QUIZ.map(q => q.id);
const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };

/** รวมความคืบหน้าสองชุดแบบเรียกซ้ำกี่ครั้งก็ได้ผลเท่าเดิม และรับเฉพาะค่าที่รู้จัก */
function mergeState(base, saved) {
  const s = saved && typeof saved === 'object' ? saved : {};
  const seen = Array.isArray(s.seen) ? s.seen.filter(id => STEP_IDS.includes(id)) : [];
  const quiz = Object.assign({}, base.quiz);
  if (s.quiz && typeof s.quiz === 'object') for (const id of QUIZ_IDS) if (s.quiz[id] === true) quiz[id] = true;
  return { seen: STEP_IDS.filter(id => base.seen.includes(id) || seen.includes(id)), lab: base.lab === true || s.lab === true, quiz };
}

let state = mergeState({ seen: [], lab: false, quiz: {} }, read());
let current = 0;
const $ = id => document.getElementById(id);
const quizCorrect = () => QUIZ_IDS.filter(id => state.quiz[id]).length;
const completed = () => state.seen.length === STEP_IDS.length && state.lab && quizCorrect() === QUIZ_IDS.length;
const percent = () => Math.round(((state.seen.length + (state.lab ? 1 : 0) + quizCorrect() / QUIZ_IDS.length) / (STEP_IDS.length + 2)) * 100);

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ไม่มีที่เก็บก็ยังเรียนได้ */ }
  kit.saveProgress({ percent: percent(), completed: completed(), state });
}

function bindSrcButtons(run) {
  document.querySelectorAll('#stepCard [data-src]').forEach(b => { b.onclick = () => run(b.dataset.src); });
}

function renderStepList() {
  $('stepList').innerHTML = '';
  [...STEPS.map(s => s.title), 'แบบฝึกหัด'].forEach((title, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = title;
    if (i === current) b.setAttribute('aria-current', 'step');
    const done = i < STEPS.length ? state.seen.includes(STEP_IDS[i]) && (STEP_IDS[i] !== 'lab' || state.lab) : quizCorrect() === QUIZ_IDS.length;
    if (done) b.className = 'seen';
    b.onclick = () => go(i);
    li.append(b); $('stepList').append(li);
  });
}

function renderQuiz(card) {
  const missing = [];
  if (state.seen.length < STEP_IDS.length) missing.push(`ยังไม่ได้เปิด: ${STEPS.filter(s => !state.seen.includes(s.id)).map(s => s.title).join(', ')}`);
  if (!state.lab) missing.push('ยังไม่ผ่านแล็บ "ลองตั้งค่าเอง"');
  card.innerHTML = `<h2>แบบฝึกหัด</h2><p class="lead">ตอบให้ถูกทุกข้อ ตอบผิดเลือกใหม่ได้</p><div id="quizList"></div>
    <p class="done" id="quizDone" aria-live="polite"></p>`;
  QUIZ.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    box.innerHTML = `<p class="qt">${qi + 1}. ${item.q}</p><div class="opts"></div><p class="why" ${state.quiz[item.id] ? '' : 'hidden'}>${item.why}</p>`;
    item.opts.forEach((text, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = text;
      if (state.quiz[item.id] && i === item.answer) b.className = 'right';
      b.onclick = () => {
        b.className = i === item.answer ? 'right' : 'wrong';
        if (i === item.answer) {
          box.querySelector('.why').hidden = false;
          if (!state.quiz[item.id]) { state.quiz[item.id] = true; save(); drawProgress(); renderStepList(); quizStatus(missing); }
        }
        kit.resize();
      };
      box.querySelector('.opts').append(b);
    });
    $('quizList').append(box);
  });
  quizStatus(missing);
}

function quizStatus(missing) {
  const n = quizCorrect();
  const el2 = $('quizDone');
  if (!el2) return;
  if (completed()) el2.textContent = 'เรียนครบบทเรียน VLAN แล้ว';
  else if (n === QUIZ_IDS.length) el2.textContent = `ตอบถูกครบทุกข้อแล้ว อีกนิดเดียว: ${missing.join(' · ')}`;
  else el2.textContent = `ตอบถูกแล้ว ${n} จาก ${QUIZ_IDS.length} ข้อ`;
}

function render() {
  animToken++;
  const onQuiz = current === STEPS.length;
  if (!onQuiz && !state.seen.includes(STEP_IDS[current])) { state.seen = STEP_IDS.filter(id => id === STEP_IDS[current] || state.seen.includes(id)); save(); }
  renderStepList();
  const card = $('stepCard');
  if (onQuiz) renderQuiz(card);
  else { card.innerHTML = STEPS[current].html(); if (STEPS[current].mount) STEPS[current].mount(); }
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = onQuiz;
  $('nextBtn').textContent = current === STEPS.length - 1 ? 'ไปทำแบบฝึกหัด' : 'ถัดไป';
  kit.setLocation(onQuiz ? 'quiz' : STEP_IDS[current]);
  drawProgress();
}

function go(i) {
  current = Math.max(0, Math.min(STEPS.length, i));
  render();
  const h = $('stepCard').querySelector('h2');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  document.querySelector('.lesson').scrollIntoView({ block: 'start' });
}

function drawProgress() {
  $('progressText').textContent = completed() ? 'เรียนครบแล้ว' : `เรียนไปแล้ว ${percent()}%`;
  $('progressBar').style.width = `${percent()}%`;
}

/* ผู้เรียนที่ login: รวมความคืบหน้าที่บันทึกไว้ในระบบกับในเครื่องนี้ (เรียกซ้ำได้ ผลเท่าเดิม) */
kit.onRestore(saved => {
  state = mergeState(state, saved);
  save();
  drawProgress();
  renderStepList();
  if (current === STEPS.length) renderQuiz($('stepCard'));
});

$('prevBtn').onclick = () => go(current - 1);
$('nextBtn').onclick = () => go(current + 1);
const startHash = location.hash.replace(/^#/, '');
if (startHash === 'quiz') current = STEPS.length;
else if (STEP_IDS.includes(startHash)) current = STEP_IDS.indexOf(startHash);
render();
</script>
</body>
</html>
