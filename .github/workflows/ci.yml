name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PR runs may be cancelled: cancelling a main run could stop a deploy halfway through a migration.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check:release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0 # pnpm 10 (lockfileVersion 9.0); keep in sync with the local toolchain

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm # caches the pnpm store keyed on pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Production init SQL is generated from schema.sql: make sure it still builds and matches it.
      - run: pnpm run db:init-sql:verify

      # typecheck + every local test suite (disposable local D1/KV/R2 via wrangler dev) + frontend build + readiness
      - run: pnpm run check:release

  # Staging deploy: runs after check:release passes on main. It stays skipped until the repo variable
  # DEPLOY_STAGING is "true". Before setting it: run `pnpm run db:init:remote -- --env staging` once if the
  # staging D1 is new, and add the secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Workers KV:Edit,
  # R2:Edit on the staging account). The account comes from env.staging in each wrangler.jsonc.
  # Production is not deployed here: follow docs/CLOUDFLARE-DEPLOY.md section 14.
  deploy-staging:
    name: deploy:staging
    if: >-
      vars.DEPLOY_STAGING == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Order matters: new backend code reads new columns, and the frontend calls the new backend.
      - name: Apply D1 migrations
        run: pnpm --filter backend exec wrangler d1 migrations apply netprime-db-staging --remote --env staging

      - run: pnpm run deploy:backend:staging

      - run: pnpm run deploy:frontend:staging
